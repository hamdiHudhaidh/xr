<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#142826">
  <title>XR Hub Schedule</title>
  <style>
    :root {
      --header: #142826;
      --cream: #F4EFE6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--header);
      cursor: none;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      overscroll-behavior: none;
    }
    #image-stage {
      position: fixed;
      inset: 0;
      /* Ithra purple-to-pink poster. */
      background: linear-gradient(135deg, #2a0f6e 0%, #7a2bbf 55%, #f04a9a 100%);
      z-index: 1;
    }
    #image-stage .blur {
      position: absolute;
      inset: -8%;
      width: 116%;
      height: 116%;
      object-fit: cover;
      filter: blur(36px) saturate(1.08);
      transform: scale(1.05);
      opacity: 0.9;
      pointer-events: none;
    }
    #poster {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      z-index: 1;
      pointer-events: none;
    }
    #video-stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
      z-index: 2;
    }
    /* 16:9 video cover-fills the viewport in any orientation. */
    #player,
    #player iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: max(100vw, calc(100vh * 16 / 9));
      height: max(100vh, calc(100vw * 9 / 16));
      transform: translate(-50%, -50%);
      border: 0;
      pointer-events: none;
    }
    .hidden { display: none !important; }
    #hint {
      position: fixed;
      left: 50%;
      bottom: 4vh;
      transform: translateX(-50%);
      z-index: 10;
      color: var(--header);
      background: rgba(244, 239, 230, 0.9);
      font: 500 18px/1.3 system-ui, -apple-system, sans-serif;
      letter-spacing: 0.02em;
      padding: 0.55em 1em;
      border-radius: 999px;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.6s ease;
    }
    #hint.fade { opacity: 0; }
    #poster-box { position: absolute; z-index: 2; pointer-events: none; }
    .hl {
      position: absolute;
      border-radius: 999px;
      border: 0.32vmin solid #EAF04A;
      box-shadow: 0 0 1.2vmin #EAF04A, 0 0 3.5vmin rgba(234, 240, 74, 0.55), inset 0 0 1.5vmin rgba(234, 240, 74, 0.35);
      animation: hlpulse 2.4s ease-in-out infinite;
    }
    .hl .tag {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #EAF04A;
      color: #2a0f6e;
      font: 800 1.15vmin/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: 0.08em;
      padding: 0.6vmin 1vmin;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 0 1.5vmin rgba(234, 240, 74, 0.7);
    }
    .hl.next {
      border-style: dashed;
      border-color: rgba(234, 240, 74, 0.75);
      animation: none;
      box-shadow: 0 0 1.4vmin rgba(234, 240, 74, 0.3);
    }
    .hl.next .tag { background: rgba(42, 15, 110, 0.95); color: #EAF04A; border: 0.15vmin solid #EAF04A; box-shadow: none; }
    .done {
      position: absolute;
      border-radius: 999px;
      background: rgba(70, 64, 92, 0.62);
      -webkit-backdrop-filter: grayscale(1) brightness(0.8);
      backdrop-filter: grayscale(1) brightness(0.8);
    }
    .done .tick {
      position: absolute; right: 2.2%; top: 50%; transform: translateY(-50%);
      font: 700 0.95vmin/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: 0.08em; color: rgba(255,255,255,0.75);
      background: rgba(30, 26, 44, 0.8); padding: 0.5vmin 0.9vmin; border-radius: 999px; white-space: nowrap;
      display: none;
    }
    .team {
      position: absolute;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #241063;
      border: 0.14vmin solid rgba(234, 240, 74, 0.55);
      border-radius: 999px;
      color: #EAF04A;
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Arabic", sans-serif;
      text-align: center;
      overflow: hidden;
    }
    .team .lbl { font-weight: 600; color: rgba(255,255,255,0.72); letter-spacing: 0.06em; line-height: 1; }
    .team .nm { font-weight: 800; line-height: 1.05; white-space: nowrap; max-width: 100%; padding: 0 6%; overflow: hidden; text-overflow: ellipsis; }
    .team.past { border-color: rgba(255,255,255,0.25); color: #d6d3df; background: #3a3550; }
    @keyframes hlpulse {
      0%, 100% { box-shadow: 0 0 1vmin #EAF04A, 0 0 2.5vmin rgba(234,240,74,0.45), inset 0 0 1vmin rgba(234,240,74,0.25); }
      50% { box-shadow: 0 0 1.8vmin #EAF04A, 0 0 5vmin rgba(234,240,74,0.7), inset 0 0 2vmin rgba(234,240,74,0.45); }
    }
  </style>
</head>
<body>
  <div id="image-stage">
    <img class="blur" src="../poster.png" alt="" aria-hidden="true">
    <img id="poster" src="../poster.png" alt="XR Hub daily schedule">
    <div id="poster-box"><div id="team-layer"></div><div id="done-layer"></div><div id="hl-layer"></div></div>
  </div>
  <div id="video-stage" class="hidden">
    <div id="player"></div>
  </div>
  <div id="hint">Tap for fullscreen</div>
  <script src="../poster-date.js"></script>
  <script src="../config.js"></script>

  <script>
    (function () {
      const VIDEO_ID = "0bbAwABTzNQ";
      const DEFAULT_IMG_SECONDS = 60;
      const ERROR_FALLBACK_MS = 4000;

      const imageStage = document.getElementById("image-stage");
      const videoStage = document.getElementById("video-stage");
      const hint = document.getElementById("hint");

      let player = null;
      let unmuted = false;
      let phase = "image";
      let imgTimer = null;
      let errorTimer = null;
      let ready = false;

      function imgSeconds() {
        const v = new URLSearchParams(location.search).get("img");
        const n = v == null ? NaN : Number(v);
        return Number.isFinite(n) && n >= 0 ? n : DEFAULT_IMG_SECONDS;
      }

      function clearTimers() {
        if (imgTimer) { clearTimeout(imgTimer); imgTimer = null; }
        if (errorTimer) { clearTimeout(errorTimer); errorTimer = null; }
      }

      function startImagePhase() {
        phase = "image";
        clearTimers();
        imageStage.classList.remove("hidden");
        videoStage.classList.add("hidden");
        if (player && typeof player.pauseVideo === "function") {
          try { player.pauseVideo(); } catch (e) {}
        }
        /* schedule only: no video */
      }

      function startVideoPhase() {
        if (!ready || !player || typeof player.playVideo !== "function") {
          imgTimer = setTimeout(startVideoPhase, 1500);
          return;
        }
        phase = "video";
        clearTimers();
        hint.classList.add("fade");
        imageStage.classList.add("hidden");
        videoStage.classList.remove("hidden");
        try {
          if (typeof player.seekTo === "function") player.seekTo(0, true);
          if (unmuted) {
            player.unMute();
          } else {
            player.mute();
          }
          player.playVideo();
        } catch (e) {
          errorTimer = setTimeout(startImagePhase, ERROR_FALLBACK_MS);
        }
      }

      function onPlayerReady() {
        ready = true;
        try { player.mute(); } catch (e) {}
      }

      function onStateChange(event) {
        if (!window.YT) return;
        if (phase === "video" && event.data === YT.PlayerState.ENDED) {
          startImagePhase();
        }
      }

      function onPlayerError() {
        if (phase !== "video") return;
        errorTimer = setTimeout(startImagePhase, ERROR_FALLBACK_MS);
      }

      window.onYouTubeIframeAPIReady = function () {
        player = new YT.Player("player", {
          videoId: VIDEO_ID,
          host: "https://www.youtube.com",
          playerVars: {
            autoplay: 0,
            mute: 1,
            controls: 0,
            rel: 0,
            playsinline: 1,
            modestbranding: 1,
            fs: 0,
            disablekb: 1,
            iv_load_policy: 3,
            cc_load_policy: 0,
            origin: location.origin
          },
          events: {
            onReady: onPlayerReady,
            onStateChange: onStateChange,
            onError: onPlayerError
          }
        });
      };

      async function unlock() {
        hint.classList.add("fade");
        try {
          if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
          }
        } catch (e) {}
        unmuted = true;
        if (player) {
          try {
            player.unMute();
            if (typeof player.setVolume === "function") player.setVolume(100);
          } catch (e) {}
        }
      }

      document.addEventListener("click", unlock);
      document.addEventListener("touchend", unlock, { passive: true });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " " || e.key === "f") unlock();
      });

      setTimeout(function () { hint.classList.add("fade"); }, 8000);

      // Load the IFrame Player API.
      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      /* no YouTube on /in */


      // ---- Current-session highlight (times in Asia/Riyadh) ----
      const IMG_W = 1920, IMG_H = 1080;
      // Pill boxes in poster pixels: [left, top, width, height]
      // Row-major, right to left: row 1 = sessions 1 (right) and 2 (left), etc.
      const COL_RIGHT = 990, COL_LEFT = 290, PILL_W = 640, PILL_H = 91, ROW_TOP0 = 494, ROW_STEP = 111;
      const pillBox = i => [i % 2 === 0 ? COL_RIGHT : COL_LEFT, ROW_TOP0 + ROW_STEP * Math.floor(i / 2)];
      const HL_PAD = 6;
      const SESSIONS = [
        ["16:15", "16:45"], ["17:30", "18:00"], ["18:30", "19:00"], ["19:15", "19:45"],
        ["20:00", "20:30"], ["20:45", "21:15"], ["21:30", "22:00"], ["22:15", "22:45"]
      ];
      const box = document.getElementById("poster-box");
      const hlLayer = document.getElementById("hl-layer");
      const doneLayer = document.getElementById("done-layer");
      const teamLayer = document.getElementById("team-layer");
      const posterImg = document.getElementById("poster");
      const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };

      function riyadhNow() {
        const sp = new URLSearchParams(location.search);
        const q = sp.get("now"), qd = sp.get("date");
        const okDate = qd && /^\d{4}-\d{2}-\d{2}$/.test(qd);
        if (q && /^\d{1,2}:\d{2}$/.test(q)) return { mins: toMin(q), ymd: okDate ? qd : "2026-11-15" };
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Riyadh", year: "numeric", month: "2-digit", day: "2-digit",
          hour: "2-digit", minute: "2-digit", hourCycle: "h23"
        }).formatToParts(new Date());
        const p = {}; parts.forEach(x => p[x.type] = x.value);
        return { mins: Number(p.hour) * 60 + Number(p.minute), ymd: okDate ? qd : `${p.year}-${p.month}-${p.day}` };
      }

      function layoutBox() {
        const vw = window.innerWidth, vh = window.innerHeight;
        const s = Math.min(vw / IMG_W, vh / IMG_H);
        box.style.width = IMG_W * s + "px";
        box.style.height = IMG_H * s + "px";
        box.style.left = (vw - IMG_W * s) / 2 + "px";
        box.style.top = (vh - IMG_H * s) / 2 + "px";
      }

      function updateHighlight() {
        const now = riyadhNow();
        let idx = -1;
        if (now.ymd >= "2026-11-12" && now.ymd <= "2026-11-30") {
          idx = SESSIONS.findIndex(([a, b]) => now.mins >= toMin(a) && now.mins < toMin(b));
        }
        let mode = "now";
        if (idx < 0 && now.ymd >= "2026-11-12" && now.ymd <= "2026-11-30") {
          idx = SESSIONS.findIndex(([a]) => now.mins < toMin(a));
          mode = "next";
        }
        hlLayer.innerHTML = "";
        renderDone(now);
        renderTeams(now);
        // The NOW/NEXT outline was removed; this only clears the layer.
      }


      // ---- Finished sessions (greyed) and assigned team names ----
      const inEvent = ymd => ymd >= "2026-11-12" && ymd <= "2026-11-30";
      const pct = (v, total) => (v / total * 100) + "%";
      function place(el, i, x, y, w, h) {
        const [left, top] = pillBox(i);
        el.style.left = pct(left + x, IMG_W); el.style.top = pct(top + y, IMG_H);
        el.style.width = pct(w, IMG_W); el.style.height = pct(h, IMG_H);
      }
      function renderDone(now) {
        doneLayer.innerHTML = "";
        if (!inEvent(now.ymd)) return;
        SESSIONS.forEach(([, b], i) => {
          if (now.mins < toMin(b)) return;
          const el = document.createElement("div");
          el.className = "done";
          place(el, i, 0, 0, PILL_W, PILL_H);
          doneLayer.appendChild(el);
        });
      }
      // Free space between the TO time and the FROM label, centred on the arrow (poster px).
      const ARROW_X = [320, 320, 320, 320, 320, 320, 332, 320];
      const ZONE_W = 260, ZONE_TOP = 13, ZONE_H = 65;
      let teamData = null;
      function renderTeams(now) {
        teamLayer.innerHTML = "";
        if (!teamData || !window.XR_resolve || !inEvent(now.ymd)) return;
        const unit = box.clientHeight / IMG_H; // screen px per poster px
        SESSIONS.forEach(([, b], i) => {
          const r = window.XR_resolve(teamData, now.ymd, i + 1);
          if (!r.team || !r.team.name) return;
          const el = document.createElement("div");
          el.className = "team" + (now.mins >= toMin(b) ? " past" : "");
          place(el, i, ARROW_X[i] - ZONE_W / 2, ZONE_TOP, ZONE_W, ZONE_H);
          const lbl = document.createElement("div");
          lbl.className = "lbl"; lbl.textContent = "TEAM · الفريق";
          lbl.style.fontSize = 12 * unit + "px";
          const nm = document.createElement("div");
          nm.className = "nm"; nm.textContent = r.team.name;
          el.appendChild(lbl); el.appendChild(nm);
          teamLayer.appendChild(el);
          // Largest font (30 poster px down to 17) that fits the chip width.
          let fs = 30;
          nm.style.fontSize = fs * unit + "px";
          while (fs > 17 && nm.scrollWidth > nm.clientWidth + 1) { fs -= 1; nm.style.fontSize = fs * unit + "px"; }
        });
      }
      async function loadTeams() {
        if (!window.XR_API) return;
        try {
          const res = await fetch(window.XR_API + "/data", { cache: "no-store" });
          if (!res.ok) throw new Error(res.status);
          teamData = await res.json();
        } catch (e) { teamData = null; }
        updateHighlight();
      }
      window.addEventListener("resize", () => { layoutBox(); updateHighlight(); });
      loadTeams();
      setInterval(loadTeams, 45000);
      window.addEventListener("resize", layoutBox);
      layoutBox();
      updateHighlight();
      setInterval(updateHighlight, 15000);

      startImagePhase();
    })();
  </script>
</body>
</html>
