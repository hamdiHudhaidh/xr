<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0f6e">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap">
<meta name="robots" content="noindex">
<title>XR Hub · Admin</title>
<style>
  :root {
    --deep: #1c0a4d; --purple: #2a0f6e; --violet: #7a2bbf; --pink: #f04a9a; --yellow: #EAF04A;
    --card: rgba(28, 10, 77, 0.72); --line: rgba(255,255,255,0.14); --muted: rgba(255,255,255,0.62);
  }
  * { box-sizing: border-box; }
  html { margin: 0; background: #2a0f6e; }
  body { margin: 0; min-height: 100vh; }
  body {
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
    color: #fff;
    background: linear-gradient(170deg, #2a0f6e 0%, #4a1690 40%, #7a2bbf 80%, #b23f93 100%);
  }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 14px 14px 90px; }
  header { display: flex; align-items: center; gap: 10px; padding: 6px 2px 12px; }
  header h1 { font-size: 20px; margin: 0; font-weight: 800; letter-spacing: .01em; }
  header h1 span { color: var(--yellow); }
  .status { margin-left: auto; font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.1); color: var(--muted); white-space: nowrap; }
  .status.ok { color: var(--yellow); }
  .status.err { background: var(--pink); color: #fff; }
  .lock { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--muted); cursor: pointer; }
  a.lock { text-decoration: none; display: inline-block; }
  nav.tabs { display: flex; gap: 6px; background: rgba(0,0,0,.18); padding: 5px; border-radius: 999px; position: sticky; top: 8px; z-index: 5; backdrop-filter: blur(8px); }
  nav.tabs button { flex: 1; border: 0; background: none; padding: 9px 6px; border-radius: 999px; font-weight: 700; cursor: pointer; color: var(--muted); }
  nav.tabs button.on { background: var(--yellow); color: var(--purple); }
  section { display: none; margin-top: 14px; }
  section.on { display: block; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 14px; margin-bottom: 12px; box-shadow: 0 6px 24px rgba(10,0,40,.25); }
  .hint { color: var(--muted); font-size: 13px; margin: 2px 2px 12px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > input { flex: 1; min-width: 0; }
  input[type=text], input[type=password], input[type=date], select {
    background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; outline: none; width: 100%;
  }
  input:focus, select:focus { border-color: var(--yellow); }
  select option { color: #000; }
  .btn { border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 800; cursor: pointer; background: var(--yellow); color: var(--purple); white-space: nowrap; }
  .btn.ghost { background: rgba(255,255,255,.1); color: #fff; font-weight: 600; }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .btn.danger { background: none; color: #ffb3d6; border: 1px solid rgba(240,74,154,.5); font-weight: 600; }
  .team-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .team-head input { font-weight: 800; font-size: 17px; background: transparent; border-color: transparent; padding-left: 4px; }
  .team-head input:hover { border-color: var(--line); }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border-radius: 999px; background: rgba(255,255,255,.12); font-weight: 600; }
  .chip button { border: 0; background: rgba(0,0,0,.25); width: 22px; height: 22px; border-radius: 50%; cursor: pointer; line-height: 1; color: #fff; }
  .plist { display: grid; gap: 6px; margin-bottom: 10px; }
  .prow { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 8px; border-radius: 16px; background: rgba(255,255,255,.1); }
  .prow .nm { flex: 1; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .av-thumb, .av-ph {
    flex: none;
    box-sizing: border-box;
    display: grid; place-items: center;
    font-weight: 800; font-size: 15px; line-height: 1;
  }
  .av-thumb {
    width: 40px; height: 72px;
    border-radius: 8px;
    object-fit: contain;
    object-position: center bottom;
    background-color: #1c0a4d;
    background-image:
      linear-gradient(45deg, rgba(255,255,255,.16) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(255,255,255,.16) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, rgba(255,255,255,.16) 75%),
      linear-gradient(-45deg, transparent 75%, rgba(255,255,255,.16) 75%);
    background-size: 10px 10px;
    background-position: 0 0, 0 5px, 5px -5px, -5px 0;
  }
  .av-ph {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.45);
    background: #5a3a9a; color: #fff;
  }
  #avatarFile { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .empty { color: var(--muted); font-style: italic; font-size: 13px; }
  .days { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: thin; }
  .days button { flex: none; border: 1px solid var(--line); background: rgba(255,255,255,.06); border-radius: 14px; padding: 6px 10px; cursor: pointer; text-align: center; min-width: 52px; }
  .days button b { display: block; font-size: 16px; }
  .days button small { color: var(--muted); font-size: 11px; }
  .days button.on { background: var(--yellow); color: var(--purple); border-color: var(--yellow); }
  .days button.on small { color: var(--purple); }
  .days button.has::after { content: ""; display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--pink); margin: 3px auto 0; }
  .days button.def { min-width: 86px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 12px; }
  .bar .grow { flex: 1 1 100%; color: var(--muted); font-size: 13px; }
  .sess { display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: start; }
  .num { width: 34px; height: 34px; border-radius: 50%; background: var(--yellow); color: var(--purple); font-weight: 900; display: grid; place-items: center; }
  .time { font-weight: 800; font-size: 16px; }
  .time small { color: var(--muted); font-weight: 500; margin-left: 6px; }
  .sess select { margin-top: 6px; }
  .tagline { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; }
  .pill { padding: 2px 9px; border-radius: 999px; background: rgba(240,74,154,.25); color: #ffd1e6; }
  .pill.def { background: rgba(255,255,255,.1); color: var(--muted); }
  .link { background: none; border: 0; color: var(--yellow); text-decoration: underline; cursor: pointer; padding: 0; font-size: 12px; }
  .people { margin-top: 10px; display: grid; gap: 6px; }
  .person { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border-radius: 14px; background: rgba(255,255,255,.06); }
  .person .nm { flex: 1; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .person.sw { background: rgba(234,240,74,.12); border: 1px solid rgba(234,240,74,.45); }
  .person .old { color: var(--muted); text-decoration: line-through; font-weight: 500; }
  .person .arr { color: var(--yellow); margin: 0 6px; font-weight: 900; }
  .person .new { color: var(--yellow); font-weight: 800; }
  .swapbox { display: flex; gap: 6px; flex: 1; }
  .swapbox input { padding: 7px 10px; }
  .roster-team { font-weight: 800; color: var(--yellow); }
  .roster-people { margin-top: 4px; color: #fff; }
  .roster-people .s { color: var(--yellow); font-weight: 700; }
  .roster-people .s i { color: var(--muted); font-weight: 400; font-style: normal; font-size: 12px; }
  .gate { max-width: 380px; margin: 14vh auto 0; text-align: center; }
  .gate h2 { margin: 0 0 6px; }
  .gate input { text-align: center; font-size: 22px; letter-spacing: .3em; margin: 14px 0 10px; }
  .err-text { color: #ffb3d6; min-height: 20px; font-size: 13px; }
  .banner { background: var(--pink); color: #fff; padding: 10px 14px; border-radius: 16px; margin-bottom: 12px; font-weight: 600; }
  .off-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .off-head h2 { margin: 0; font-size: 16px; font-weight: 800; }
  .off-head h2 span { color: var(--yellow); }
  .off-head .off-date { width: auto; flex: none; }
  .off-summary { color: var(--muted); font-size: 13px; margin: 8px 2px 0; }
  .off-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .off-chip {
    border: 1px solid var(--line); background: rgba(255,255,255,.1); border-radius: 999px;
    padding: 7px 12px; font-weight: 700; cursor: pointer; color: #fff;
  }
  .off-chip.on { background: var(--yellow); color: var(--purple); border-color: var(--yellow); }
  .off-team { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .04em; margin: 10px 0 6px; }
  .off-team:first-child { margin-top: 0; }

  .nbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 12px; }
  .nbar .grow { flex: 1 1 200px; color: var(--muted); font-size: 13px; }
  .nbar input[type=date] { width: auto; flex: none; background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; outline: none; }
  .sess-card.counted { border-color: rgba(234,240,74,.45); }
  .sess-top { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px; }
  .sess-card.counted .num { background: #c4a0ff; color: var(--purple); }
  .who { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .who b { color: #fff; font-weight: 700; }
  .badge { margin-left: auto; flex: none; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; background: rgba(196,160,255,.22); color: #e4d0ff; }
  .badge.wait { background: rgba(255,255,255,.1); color: var(--muted); }
  .counters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .counter { background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 18px; padding: 10px 10px 12px; text-align: center; }
  .counter .clabel { font-weight: 800; font-size: 13px; }
  .counter .clabel .ar { font-family: Cairo, "Noto Sans Arabic", sans-serif; direction: rtl; color: #c4a0ff; }
  .counter .clabel .en { display: block; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; }
  .step { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
  .step button {
    width: 56px; height: 56px; border: 0; border-radius: 50%;
    background: var(--yellow); color: var(--purple); font-size: 32px; font-weight: 800;
    line-height: 1; cursor: pointer; touch-action: manipulation; user-select: none;
    display: grid; place-items: center; padding: 0;
  }
  .step button:active { transform: scale(0.96); }
  .step input {
    width: 84px; text-align: center; font-size: 28px; font-weight: 800;
    padding: 8px 4px; border-radius: 16px; font-variant-numeric: tabular-nums;
    color: #c4a0ff; background: rgba(255,255,255,.08); border: 1px solid var(--line); outline: none;
  }
  .step input:focus { border-color: var(--yellow); }
  .clear { margin-top: 10px; }
  .day-total {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px;
    position: sticky; top: 0; z-index: 5;
    background: rgba(28, 10, 77, 0.94);
    border-color: rgba(234,240,74,.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .day-total .dt-label { flex: 1 1 140px; }
  .day-total .dt-label .ar { font-family: Cairo, "Noto Sans Arabic", sans-serif; font-weight: 800; font-size: 18px; direction: rtl; color: var(--yellow); }
  .day-total .dt-label .en { display: block; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; }
  .dt-stats { display: flex; gap: 10px; flex: 2 1 320px; }
  .dt-stat { flex: 1; background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 16px; padding: 8px 12px; min-width: 0; }
  .dt-stat .n { font-weight: 800; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
  .dt-stat.p .n { color: #c4a0ff; }
  .dt-stat.e .n { color: var(--yellow); }
  .dt-stat.c { flex: 1.35; background: rgba(234, 240, 74, 0.16); border-color: rgba(234, 240, 74, 0.55); }
  .dt-stat.c .n { color: #fff; font-size: 34px; }
  .dt-stat .lbl { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .dt-stat .lbl .ar { font-family: Cairo, "Noto Sans Arabic", sans-serif; font-weight: 800; font-size: 13px; direction: rtl; }
  .dt-stat.p .lbl .ar, .dt-stat.p .lbl .en { color: #c4a0ff; }
  .dt-stat.e .lbl .ar, .dt-stat.e .lbl .en { color: var(--yellow); }
  .dt-stat.c .lbl .ar, .dt-stat.c .lbl .en { color: #fff; }
  .dt-stat .lbl .en { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  @media (max-width: 620px) { .counters { grid-template-columns: 1fr; } .step button { width: 64px; height: 64px; } }

  @media (max-width: 520px) { .wrap { padding: 10px 10px 80px; } .card { padding: 12px; border-radius: 18px; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="../config.js"></script>
<script>
(function () {
  "use strict";
  const API = window.XR_API;
  const SESS = window.XR_SESSIONS;
  const PASS_KEY = "xrAdminPasscode";
  const COLORS = ["#EAF04A", "#f04a9a", "#5fe0c8", "#ff9f43", "#8ab4ff", "#c58cff", "#7bd389", "#ff6b6b"];
  const app = document.getElementById("app");

  const DATES = [];
  for (let d = new Date(Date.UTC(2026, 10, 12)); d <= new Date(Date.UTC(2026, 10, 30)); d.setUTCDate(d.getUTCDate() + 1)) {
    DATES.push(d.toISOString().slice(0, 10));
  }
  const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const dow = ymd => DOW[new Date(ymd + "T12:00:00Z").getUTCDay()];
  const fmt12 = t => { let [h, m] = t.split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + ":" + String(m).padStart(2, "0") + " " + ap; };
  const sessTime = i => fmt12(SESS[i][0]).replace(" PM", "") + "–" + fmt12(SESS[i][1]);
  function todayRiyadh() {
    const q = new URLSearchParams(location.search).get("date");
    if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) return q;
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Riyadh", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  }
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => "t" + Math.random().toString(36).slice(2, 9);

  let data = null;
  let avatars = {};
  let pass = localStorage.getItem(PASS_KEY) || "";
  const today = todayRiyadh();
  let tab = new URLSearchParams(location.search).get("tab") || "teams";
  if (tab === "roster") tab = "numbers";
  const ui = { tab: tab, day: DATES.includes(today) ? today : "default", numbersDay: DATES.includes(today) ? today : DATES[0], swapping: null };
  let saveTimer = null, dirty = false, statusText = "", statusCls = "";

  function clampCount(n) {
    n = Math.round(Number(n));
    if (!Number.isFinite(n) || n < 0) return 0;
    return Math.min(9999, n);
  }
  function normalizeNumbers(raw) {
    const out = {};
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) return out;
    for (const k of Object.keys(raw)) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
      const day = raw[k];
      if (!day || typeof day !== "object" || Array.isArray(day)) continue;
      const sess = {};
      for (const s of Object.keys(day)) {
        if (!/^[1-8]$/.test(s)) continue;
        const v = day[s];
        if (!v || typeof v !== "object" || Array.isArray(v)) continue;
        const rec = {};
        if (Number.isFinite(Number(v.participants))) rec.participants = clampCount(v.participants);
        if (Number.isFinite(Number(v.engagement))) rec.engagement = clampCount(v.engagement);
        if ("participants" in rec || "engagement" in rec) sess[s] = rec;
      }
      if (Object.keys(sess).length) out[k] = sess;
    }
    return out;
  }
  function normalizeOffDays(raw) {
    const out = {};
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) return out;
    for (const k of Object.keys(raw)) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
      const names = Array.isArray(raw[k]) ? raw[k] : [];
      const seen = new Set();
      const list = [];
      for (const n of names) {
        const name = String(n || "").trim();
        if (!name || name.length > 80 || seen.has(name)) continue;
        seen.add(name);
        list.push(name);
      }
      if (list.length) out[k] = list;
    }
    return out;
  }
  function normalize(d) {
    d = d && typeof d === "object" ? d : {};
    const known = { version: 1, teams: Array.isArray(d.teams) ? d.teams : [], daily: d.daily || {}, days: d.days || {}, swaps: d.swaps || {}, offDays: normalizeOffDays(d.offDays), numbers: normalizeNumbers(d.numbers), updatedAt: d.updatedAt || null };
    for (const k of Object.keys(d)) if (!(k in known)) known[k] = d[k];
    return known;
  }

  async function api(method, body, extra) {
    const res = await fetch(API + "/data" + (extra || ""), {
      method, cache: "no-store",
      headers: Object.assign({ "Content-Type": "application/json" }, method === "GET" ? {} : { "X-Passcode": pass }),
      body: body == null ? undefined : JSON.stringify(body)
    });
    if (res.status === 401) { const e = new Error("passcode"); e.code = 401; throw e; }
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  async function apiAvatars(method, body) {
    const res = await fetch(API + "/avatars", {
      method, cache: "no-store",
      headers: Object.assign({ "Content-Type": "application/json" }, method === "GET" ? {} : { "X-Passcode": pass }),
      body: body == null ? undefined : JSON.stringify(body)
    });
    if (res.status === 401) { const e = new Error("passcode"); e.code = 401; throw e; }
    if (res.status === 404) {
      if (method === "GET") return {};
      throw new Error("HTTP 404");
    }
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  const AVATAR_PALETTE = [
    { bg: "#EAF04A", fg: "#2a0f6e" },
    { bg: "#f04a9a", fg: "#fff" },
    { bg: "#5fe0c8", fg: "#0b3b34" },
    { bg: "#ff9f43", fg: "#3a1d00" },
    { bg: "#8ab4ff", fg: "#0b1c40" },
    { bg: "#c58cff", fg: "#1a0833" },
    { bg: "#7bd389", fg: "#0c2e14" },
    { bg: "#ff6b6b", fg: "#3a0a0a" }
  ];
  function initials(name) {
    const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    if (parts.length === 1) return Array.from(parts[0])[0].toUpperCase();
    const a = Array.from(parts[0])[0], b = Array.from(parts[parts.length - 1])[0];
    return (a + b).toUpperCase();
  }
  function colorFor(name) {
    let h = 0; const s = String(name);
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return AVATAR_PALETTE[Math.abs(h) % AVATAR_PALETTE.length];
  }
  function thumbHtml(name) {
    const src = avatars[name];
    if (src) return `<img class="av-thumb" src="${esc(src)}" alt="${esc(name)}">`;
    const c = colorFor(name);
    return `<span class="av-ph" style="background:${c.bg};color:${c.fg}" aria-hidden="true">${esc(initials(name))}</span>`;
  }
  function isImageFile(file) {
    if (!file) return false;
    if (!file.type) return /\.(png|jpe?g|webp|gif|heic|heif)$/i.test(file.name || "");
    return file.type.startsWith("image/");
  }
  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const fail = () => reject(new Error("Couldn't read that image."));
      const fromEl = () => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); fail(); };
        img.src = url;
      };
      if (typeof createImageBitmap === "function") {
        createImageBitmap(file).then(resolve).catch(fromEl);
      } else fromEl();
    });
  }
  function trimAlphaBox(img) {
    const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const ctx = c.getContext("2d", { alpha: true });
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0);
    let minX = w, minY = h, maxX = -1, maxY = -1;
    try {
      const data = ctx.getImageData(0, 0, w, h).data;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (data[(y * w + x) * 4 + 3] > 8) {
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
            if (y > maxY) maxY = y;
          }
        }
      }
    } catch (e) { /* tainted canvas; use the full image */ }
    if (maxX < minX) return { sx: 0, sy: 0, sw: w, sh: h };
    const pad = 2;
    const sx = Math.max(0, minX - pad), sy = Math.max(0, minY - pad);
    const ex = Math.min(w, maxX + 1 + pad), ey = Math.min(h, maxY + 1 + pad);
    return { sx, sy, sw: Math.max(1, ex - sx), sh: Math.max(1, ey - sy) };
  }
  let webpAlphaOk = null;
  function probeWebpAlpha() {
    if (webpAlphaOk !== null) return Promise.resolve(webpAlphaOk);
    return new Promise(resolve => {
      const c = document.createElement("canvas");
      c.width = 2; c.height = 2;
      const ctx = c.getContext("2d", { alpha: true });
      ctx.clearRect(0, 0, 2, 2);
      ctx.fillStyle = "rgba(0,255,0,0.6)";
      ctx.fillRect(0, 0, 1, 1);
      let url = "";
      try { url = c.toDataURL("image/webp", 0.8); } catch (e) { webpAlphaOk = false; resolve(false); return; }
      if (!url.startsWith("data:image/webp")) { webpAlphaOk = false; resolve(false); return; }
      const im = new Image();
      im.onload = () => {
        const t = document.createElement("canvas");
        t.width = 2; t.height = 2;
        const x = t.getContext("2d", { alpha: true });
        x.clearRect(0, 0, 2, 2);
        x.drawImage(im, 0, 0);
        const clear = x.getImageData(1, 1, 1, 1).data[3] < 16;
        const kept = x.getImageData(0, 0, 1, 1).data[3] > 20;
        webpAlphaOk = clear && kept;
        resolve(webpAlphaOk);
      };
      im.onerror = () => { webpAlphaOk = false; resolve(false); };
      im.src = url;
    });
  }
  async function resizeAvatar(file) {
    if (!isImageFile(file)) throw new Error("Please choose an image.");
    const img = await loadImage(file);
    const box = trimAlphaBox(img);
    const MAX = 300000; // stay under the Worker's 400,000-character cap
    const MAX_SIDE = 360;
    const useWebp = await probeWebpAlpha();
    const draw = (maxSide, quality) => {
      const scale = Math.min(1, maxSide / Math.max(box.sw, box.sh));
      const dw = Math.max(1, Math.round(box.sw * scale));
      const dh = Math.max(1, Math.round(box.sh * scale));
      const canvas = document.createElement("canvas");
      canvas.width = dw; canvas.height = dh;
      const ctx = canvas.getContext("2d", { alpha: true });
      ctx.clearRect(0, 0, dw, dh); // never fill black / opaque
      ctx.drawImage(img, box.sx, box.sy, box.sw, box.sh, 0, 0, dw, dh);
      if (useWebp) {
        const webp = canvas.toDataURL("image/webp", quality);
        if (webp.startsWith("data:image/webp")) return webp;
      }
      return canvas.toDataURL("image/png");
    };
    let side = MAX_SIDE, q = 0.86, data = draw(side, q);
    while (data.length > MAX && useWebp && q > 0.5) { q -= 0.08; data = draw(side, q); }
    while (data.length > MAX && side > 96) { side -= 20; data = draw(side, q); }
    if (data.startsWith("data:image/jpeg")) throw new Error("Couldn't keep the transparent background. Try a PNG cut-out.");
    if (data.length > 400000) throw new Error("That photo is too large. Try a simpler cut-out.");
    return data;
  }

    inp.value = "";
    inp.onchange = async () => {
      const file = inp.files && inp.files[0];
      const who = avatarTarget;
      avatarTarget = null;
      inp.value = "";
      if (!file || !who) return;
      try {
        setStatus("Resizing photo…");
        const dataUrl = await resizeAvatar(file);
        avatars[who] = dataUrl;
        await saveAvatars();
        render();
      } catch (e) {
        setStatus(e.message || "Couldn't use that image", "err");
      }
    };
    inp.click();
  }

  // ---------- Events ----------
  function bind() {
    document.getElementById("lockBtn").onclick = () => { localStorage.removeItem(PASS_KEY); pass = ""; renderGate(); };
    app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { ui.tab = b.dataset.tab; ui.swapping = null; render(); window.scrollTo(0, 0); });

    const nt = document.getElementById("newTeam");
    if (nt) nt.onsubmit = ev => { ev.preventDefault(); const v = nt.querySelector("input").value.trim(); if (!v) return; change(() => data.teams.push({ id: uid(), name: v, people: [] })); };

    app.querySelectorAll("[data-team]").forEach(card => {
      const t = teamById(card.dataset.team);
      const nameIn = card.querySelector(".tname");
      nameIn.onchange = () => { const v = nameIn.value.trim(); if (v && v !== t.name) change(() => t.name = v); else nameIn.value = t.name; };
      card.querySelector(".addp").onsubmit = ev => {
        ev.preventDefault(); const inp = ev.target.querySelector("input"); const v = inp.value.trim(); if (!v) return;
        if (t.people.includes(v)) { inp.select(); return; }
        change(() => t.people.push(v));
        const again = app.querySelector(`[data-team="${t.id}"] .addp input`); if (again) again.focus();
      };
      card.querySelectorAll("[data-act=delperson]").forEach(b => b.onclick = () => change(() => t.people.splice(Number(b.dataset.i), 1)));
      card.querySelectorAll("[data-act=setavatar]").forEach(b => b.onclick = () => pickAvatar(b.dataset.name));
      card.querySelectorAll("[data-act=delavatar]").forEach(b => b.onclick = () => {
        const name = b.dataset.name;
        if (!confirm("Remove the photo for " + name + "?")) return;
        delete avatars[name];
        saveAvatars();
        render();
      });
      card.querySelector("[data-act=delteam]").onclick = () => {
        if (!confirm(`Delete "${t.name}"? It will be removed from every session it's assigned to.`)) return;
        change(() => {
          data.teams = data.teams.filter(x => x !== t);
          for (const k in data.daily) if (data.daily[k] === t.id) delete data.daily[k];
          for (const d in data.days) for (const k in data.days[d]) if (data.days[d][k] === t.id) data.days[d][k] = "";
        });
      };
    });

    app.querySelectorAll("#dayStrip [data-day]").forEach(b => b.onclick = () => { ui.day = b.dataset.day; ui.swapping = null; render(); });
    app.querySelectorAll("#numbersStrip [data-day]").forEach(b => b.onclick = () => { ui.numbersDay = b.dataset.day; render(); });
    const nd = document.getElementById("numbersDate");
    if (nd) nd.onchange = () => { if (DATES.includes(nd.value)) { ui.numbersDay = nd.value; render(); } };
    app.querySelectorAll("[data-act=ninc]").forEach(b => bindNumStep(b, () => numBump(Number(b.dataset.s), b.dataset.field, 1)));
    app.querySelectorAll("[data-act=ndec]").forEach(b => bindNumStep(b, () => numBump(Number(b.dataset.s), b.dataset.field, -1)));
    app.querySelectorAll(".counter input").forEach(inp => {
      const field = inp.closest(".counter").dataset.field;
      const s = Number(inp.closest(".counter").dataset.s);
      const apply = () => {
        const raw = inp.value.trim();
        if (raw === "") return;
        if (!/^\d+$/.test(raw)) { const cur = numVal(s, field); inp.value = cur == null ? "" : String(cur); return; }
        numSet(s, field, raw);
        inp.value = String(numVal(s, field));
        numBump(s, field, 0);
      };
      inp.addEventListener("change", apply);
      inp.addEventListener("blur", apply);
    });
    app.querySelectorAll("[data-act=nclear]").forEach(b => b.onclick = () => { numClear(Number(b.dataset.s)); render(); });
    const od = document.getElementById("offDate");
    if (od) od.onchange = () => {
      const v = od.value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
      ui.day = v; ui.swapping = null; render();
    };
    app.querySelectorAll("[data-act=toggleoff]").forEach(b => b.onclick = () => {
      if (ui.day === "default") return;
      const name = b.dataset.name;
      change(() => {
        const cur = new Set(data.offDays[ui.day] || []);
        if (cur.has(name)) cur.delete(name); else cur.add(name);
        if (cur.size) data.offDays[ui.day] = [...cur];
        else delete data.offDays[ui.day];
      });
    });
    const strip = document.querySelector("section.on .days .on"); if (strip) strip.scrollIntoView({ block: "nearest", inline: "center" });

    app.querySelectorAll("select[data-sess]").forEach(sel => sel.onchange = () => {
      const s = sel.dataset.sess, v = sel.value, day = ui.day;
      change(() => {
        if (day === "default") { if (v) data.daily[s] = v; else delete data.daily[s]; return; }
        const prev = resolve(day, s).team; if (!prev || prev.id !== v) cleanSwaps(day, s);
        const days = data.days[day] = data.days[day] || {};
        if ((data.daily[s] || "") === v) delete days[s]; else days[s] = v;
        if (!Object.keys(days).length) delete data.days[day];
      });
    });
    app.querySelectorAll("[data-act=usedef]").forEach(b => b.onclick = () => change(() => {
      const s = b.dataset.s; cleanSwaps(ui.day, s); delete data.days[ui.day][s]; if (!Object.keys(data.days[ui.day]).length) delete data.days[ui.day];
    }));
    const rd = app.querySelector("[data-act=resetday]");
    if (rd) rd.onclick = () => { if (confirm("Put every session on this day back to the default teams? Swaps on this day are cleared too.")) change(() => { delete data.days[ui.day]; for (const k in data.swaps) if (k.startsWith(ui.day + "|")) delete data.swaps[k]; }); };
    const ca = app.querySelector("[data-act=copyall]");
    if (ca) ca.onclick = () => {
      if (!confirm("Use this day's teams as the default for every day (12–30 Nov)? Changes made on other days are cleared. Swaps stay.")) return;
      change(() => {
        const nd = {}; SESS.forEach((_, i) => { const r = resolve(ui.day, i + 1); if (r.team) nd[i + 1] = r.team.id; });
        data.daily = nd; data.days = {};
        for (const k in data.swaps) { const [d, s] = k.split("|"); const r = resolve(d, s); data.swaps[k] = (data.swaps[k] || []).filter(w => r.team && r.team.people.includes(w.from)); if (!data.swaps[k].length) delete data.swaps[k]; }
      });
    };
    app.querySelectorAll("[data-act=swap]").forEach(b => b.onclick = () => { ui.swapping = { key: ui.day + "|" + b.dataset.s, from: b.dataset.from }; render(); const i = app.querySelector(".swapbox input"); if (i) i.focus(); });
    app.querySelectorAll("[data-act=cancelswap]").forEach(b => b.onclick = () => { ui.swapping = null; render(); });
    app.querySelectorAll(".swapbox").forEach(f => f.onsubmit = ev => {
      ev.preventDefault(); const v = f.querySelector("input").value.trim(); if (!v) return;
      const key = ui.day + "|" + f.dataset.s, from = f.dataset.from;
      ui.swapping = null;
      if (v === from) { render(); return; }
      change(() => { const list = (data.swaps[key] || []).filter(w => w.from !== from); list.push({ from, to: v }); data.swaps[key] = list; });
    });
    app.querySelectorAll("[data-act=undo]").forEach(b => b.onclick = () => change(() => {
      const key = ui.day + "|" + b.dataset.s; data.swaps[key] = (data.swaps[key] || []).filter(w => w.from !== b.dataset.from); if (!data.swaps[key].length) delete data.swaps[key];
    }));
  }

  start();
})();
</script>
</body>
</html>
