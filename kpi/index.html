<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b0520">
<title>XR Hub · KPI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap">
<style>
  :root {
    --deep: #0b0520;
    --navy: #140832;
    --purple: #2a0f6e;
    --violet: #7a2bbf;
    --pink: #f04a9a;
    --yellow: #EAF04A;
    --lilac: #c4a0ff;
    --cream: #F4EFE6;
    --muted: rgba(255,255,255,0.62);
    --fire: #ff8a2a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--deep);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  body {
    font-family: Cairo, "Noto Sans Arabic", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #fff;
  }
  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 50% 36% at 78% 10%, rgba(255, 230, 180, 0.16), transparent 62%),
      radial-gradient(ellipse 70% 40% at 50% 100%, rgba(240, 74, 154, 0.12), transparent 70%),
      radial-gradient(ellipse 55% 38% at 18% 86%, rgba(122, 43, 191, 0.16), transparent 70%),
      linear-gradient(180deg, #070314 0%, #12062e 32%, #1a0a3a 52%, #162016 78%, #1a140e 100%);
    pointer-events: none;
  }
  #stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  #stars i {
    position: absolute; display: block; border-radius: 50%; background: #fff;
    box-shadow: 0 0 6px rgba(255,255,255,0.8);
    animation: twinkle 3.4s ease-in-out infinite;
  }
  @keyframes twinkle { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  .moon {
    position: fixed; z-index: 1; top: 5.5%; right: 9%;
    width: 7.2vmin; height: 7.2vmin; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff8e4, #e8d9a8 55%, #cbb87a 100%);
    box-shadow: 0 0 3.5vmin 1.2vmin rgba(255, 230, 170, 0.22), 0 0 8vmin 2vmin rgba(234, 240, 74, 0.08);
    pointer-events: none;
  }
  .moon::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 68% 40%, transparent 42%, rgba(11, 5, 32, 0.18) 80%);
  }
  .buildings {
    position: fixed; left: 0; right: 0; top: 2%; height: 46%;
    z-index: 2; pointer-events: none;
  }
  .buildings .b {
    position: absolute; object-fit: contain; object-position: bottom center;
    filter: brightness(0.9) saturate(0.85);
    pointer-events: none;
  }
  .buildings .ithra {
    left: 0%; bottom: 0; height: 100%; width: 44%;
    object-position: left bottom;
    filter: brightness(0.92) saturate(0.88) drop-shadow(0 1.2vmin 2.4vmin rgba(40, 70, 140, 0.35));
  }
  .buildings .expo {
    right: -1%; bottom: 4%; height: 82%; width: 54%;
    object-position: right bottom;
    filter: brightness(0.94) saturate(0.88) drop-shadow(0 1.2vmin 2.4vmin rgba(40, 70, 140, 0.35));
  }
  #woods {
    position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden;
  }
  #woods .tree {
    position: absolute;
    bottom: auto;
    transform-origin: 50% 100%;
    object-fit: contain;
    object-position: bottom center;
    pointer-events: none;
    filter: drop-shadow(0 0.4vmin 0.8vmin rgba(0,0,0,0.45));
  }
  .ground {
    position: fixed; left: 0; right: 0; bottom: 0; height: 56%;
    z-index: 4; pointer-events: none;
    background:
      radial-gradient(ellipse 52% 36% at 50% 78%, rgba(110, 72, 36, 0.55), transparent 68%),
      radial-gradient(ellipse 80% 55% at 50% 100%, rgba(28, 18, 10, 0.96), transparent 72%),
      linear-gradient(180deg, transparent 0%, rgba(16, 28, 12, 0.45) 10%, #1c2414 24%, #2a2014 48%, #24180f 78%, #1a120c 100%);
  }
  .ground::before {
    content: "";
    position: absolute; left: -8%; right: -8%; top: 0; height: 22%;
    background: radial-gradient(ellipse at center, rgba(10, 16, 8, 0.55), transparent 70%);
  }
  .ground::after {
    content: "";
    position: absolute; left: 12%; right: 12%; top: 28%; bottom: 2%;
    background: radial-gradient(ellipse at 50% 55%, rgba(92, 60, 28, 0.42), rgba(50, 34, 16, 0.18) 48%, transparent 72%);
  }
  #floor { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  #floor .leaf {
    position: absolute; width: 1.1vmin; height: 0.55vmin; border-radius: 0 70% 0 70%;
    transform-origin: 50% 50%;
    opacity: 0.72;
  }
  #floor .tuft {
    position: absolute; width: 1.6vmin; height: 0.9vmin; border-radius: 50% 50% 40% 40%;
    background: rgba(36, 64, 22, 0.45);
    transform-origin: 50% 100%;
  }
  .brand { position: fixed; z-index: 12; top: 2.2%; left: 2.4%; pointer-events: none; }
  .brand .kicker { font-weight: 800; letter-spacing: 0.18em; font-size: 1.25vmin; color: var(--yellow); text-transform: uppercase; }
  .brand h1 { display: flex; align-items: baseline; gap: 0.55em; line-height: 1; }
  .brand h1 .ar { font-size: 3.2vmin; font-weight: 800; color: #fff; direction: rtl; }
  .brand h1 .en { font-size: 2.2vmin; font-weight: 800; color: var(--yellow); letter-spacing: 0.06em; }
  .sky-totals {
    position: fixed; z-index: 12; top: 3.2%; left: 22%; right: 22%;
    display: flex; justify-content: center; align-items: flex-start; gap: 4.5vw;
    pointer-events: none;
  }
  .constel { text-align: center; text-shadow: 0 0 1.6vmin rgba(255,255,255,0.28), 0 0.3vmin 1.2vmin rgba(10, 0, 40, 0.55); min-width: 0; }
  .constel .n { font-weight: 800; font-size: 6.2vmin; line-height: 0.92; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .constel.p .n { color: var(--lilac); }
  .constel.e .n { color: var(--yellow); }
  .constel.c .n { color: #fff; font-size: 6.8vmin; }
  .constel .lbl { margin-top: 0.3vh; display: flex; justify-content: center; align-items: baseline; gap: 0.5em; }
  .constel .lbl .ar { font-weight: 800; font-size: 1.55vmin; direction: rtl; }
  .constel .lbl .en { font-weight: 700; font-size: 1.05vmin; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.88; }
  .constel.p .lbl { color: var(--lilac); }
  .constel.e .lbl { color: var(--yellow); }
  .constel.c .lbl { color: #fff; }
  #piles3d {
    position: fixed; inset: 0; z-index: 5; width: 100%; height: 100%;
    display: block; pointer-events: none;
  }
  #plots { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  .plot {
    position: absolute; display: flex; flex-direction: column; align-items: center;
    transform: translate(-50%, -100%);
    transform-origin: 50% 100%; pointer-events: none;
  }
  .plot-stack {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.25vmin;
    transform: translate(-50%, -100%);
    pointer-events: none;
  }
  .plot-val, .plot-tot {
    font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums;
    padding: 0.22vmin 0.8vmin;
    border-radius: 999px;
    background: rgba(6, 3, 16, 0.92);
    box-shadow: 0 0 0.2vmin rgba(255,255,255,0.28), 0 0 1.1vmin rgba(6,3,16,0.95);
    pointer-events: none;
    white-space: nowrap;
  }
  .plot-tot { font-size: 2.55vmin; color: #fff; padding: 0.32vmin 1.05vmin; }
  .plot-val { font-size: 1.8vmin; }
  .plot-val.p { color: #e8d8ff; }
  .plot-val.e { color: var(--yellow); }
  .plot.ground {
    transform: translate(-50%, 18px);
  }
  .plot .shadow {
    width: 4.2vmin; height: 1.1vmin; margin-top: 0.1vh; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.55), transparent 70%);
  }
  .plot.empty .pad {
    width: 4.6vmin; height: 2vmin;
    border: 0.16vmin dashed rgba(234, 240, 74, 0.4);
    border-radius: 50%;
    background: rgba(234, 240, 74, 0.08);
    margin-top: 0.2vh;
  }
  .plot .day-lbl {
    margin-top: 0.45vh;
    font-weight: 800; font-size: 1.85vmin; letter-spacing: 0.04em;
    color: #fff; line-height: 1; text-transform: uppercase;
    padding: 0.2vmin 0.85vmin;
    border-radius: 999px;
    background: rgba(6, 3, 16, 0.82);
    box-shadow: 0 0 0.15vmin rgba(255,255,255,0.2), 0 0 0.8vmin rgba(6,3,16,0.8);
  }
  .plot.today .day-lbl { color: var(--yellow); }
  .camp {
    position: fixed; left: 0; right: 0; bottom: 0; height: 52%;
    z-index: 8; pointer-events: none;
  }
  .fire-glow {
    position: absolute; left: 50%; bottom: 18%; width: 46vmin; height: 22vmin;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 80%, rgba(255, 140, 40, 0.55), rgba(255, 80, 20, 0.12) 42%, transparent 70%);
    filter: blur(8px);
    animation: glowpulse 1.8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glowpulse {
    0%, 100% { opacity: 0.75; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.06); }
  }
  #fire {
    position: absolute; left: 50%; bottom: 14.8%;
    width: 12.8vmin; height: auto;
    transform: translateX(-50%);
    z-index: 40; pointer-events: none;
  }
  #fire .frame {
    position: absolute; left: 0; bottom: 0; width: 12.8vmin; height: auto;
    display: block; opacity: 0;
    filter: drop-shadow(0 0 1.4vmin rgba(255, 140, 40, 0.55));
  }
  #fire .frame:first-child { position: relative; }
  #fire .frame.on { opacity: 1; }
  #team { position: fixed; inset: 0; z-index: 9; pointer-events: none; }
  #seat-names {
    position: fixed; inset: 0; z-index: 11; pointer-events: none;
  }
  #seat-names .av-name {
    position: absolute;
    width: auto;
    min-width: 0;
    max-width: none;
    white-space: nowrap;
  }
  .member {
    position: absolute; display: flex; flex-direction: column; align-items: center;
    transform: translate(-50%, -100%);
    pointer-events: none;
  }
  .member .av {
    flex: none; transform-origin: 50% 100%;
    animation: sway 3.2s ease-in-out infinite;
    will-change: transform;
  }
  .member .av.photo {
    object-fit: contain; object-position: center bottom;
    background: transparent; border: 0; box-shadow: none;
  }
  .member .av.fallback {
    border-radius: 50%; border: 0.2vmin solid rgba(255,255,255,0.85);
    background: #5a3a9a; color: #fff; font-weight: 800;
    display: grid; place-items: center; line-height: 1;
  }
  .av-name {
    width: max-content; min-width: 100%; max-width: none;
    text-align: center; color: var(--yellow);
    font-family: Cairo, "Noto Sans Arabic", "Segoe UI", system-ui, sans-serif;
    font-weight: 700; line-height: 1.15; white-space: nowrap;
    overflow: visible; unicode-bidi: plaintext;
    flex: none; text-shadow: 0 0.15vmin 0.5vmin rgba(10,0,30,0.85);
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-3.2deg); }
    50% { transform: rotate(3.2deg); }
  }
  @keyframes sway-flip {
    0%, 100% { transform: scaleX(-1) rotate(-3.2deg); }
    50% { transform: scaleX(-1) rotate(3.2deg); }
  }
  .member.sit .av { animation-duration: 4.4s; }
  .member.flip .av { animation-name: sway-flip; transform: scaleX(-1); }
  @media (max-aspect-ratio: 3/4) {
    .sky-totals { left: 4%; right: 4%; gap: 3vw; top: 8%; }
    .brand { top: 1.4%; }
    .buildings .ithra { width: 78%; height: 88%; }
    .buildings .expo { width: 78%; height: 58%; }
  }
</style>
</head>
<body>
  <div class="sky"></div>
  <div id="stars"></div>
  <div class="moon" aria-hidden="true"></div>
  <div class="buildings">
    <img class="b ithra" src="../assets/bg-ithra.png" alt="Ithra">
    <img class="b expo" src="../assets/bg-expo.png" alt="Expo">
  </div>
  <div id="woods" aria-hidden="true"></div>
  <div class="ground"><div id="floor"></div></div>
  <canvas id="piles3d"></canvas>
  <header class="brand">
    <div class="kicker">XR Hub</div>
    <h1><span class="ar">المؤشرات</span><span class="en">KPI</span></h1>
  </header>
  <section class="sky-totals" id="skyTotals"></section>
  <section id="plots"></section>
  <section class="camp">
    <div class="fire-glow" aria-hidden="true"></div>
    <div id="team"></div>
    <div id="fire">
      <img class="frame on" src="../assets/bonfire.png" alt="">
      <img class="frame" src="../assets/bonfire-flame-2.png" alt="">
      <img class="frame" src="../assets/bonfire-flame-3.png" alt="">
    </div>
  </section>
  <script src="vendor/three.min.js"></script>
  <script src="piles3d.js"></script>
  <script src="../config.js"></script>
  <script>
  (function () {
    "use strict";
    const API = window.XR_API;
    const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const AVATAR_PALETTE = [
      { bg: "#EAF04A", fg: "#2a0f6e" },
      { bg: "#f04a9a", fg: "#fff" },
      { bg: "#5fe0c8", fg: "#0b3b34" },
      { bg: "#ff9f43", fg: "#3a1d00" },
      { bg: "#8ab4ff", fg: "#0b1c40" },
      { bg: "#c58cff", fg: "#1a0833" },
      { bg: "#7bd389", fg: "#0c2e14" },
      { bg: "#ff6b6b", fg: "#3a0a0a" }
    ];
    const TREE_SRC = [
      { src: "../assets/tree-1.png", aspect: 325 / 500 },
      { src: "../assets/tree-2.png", aspect: 371 / 500 },
      { src: "../assets/tree-3.png", aspect: 323 / 500 },
      { src: "../assets/tree-4.png", aspect: 373 / 500 }
    ];
    const LEAF_COLORS = ["#6a3a14", "#4a2e10", "#7a4a1c", "#3d4a1c", "#5a2810", "#8a5a22", "#2e3a16"];

    if (new URLSearchParams(location.search).get("embed") === "1") {
      document.documentElement.classList.add("embed");
    }

    let data = null;
    let avatars = {};
    let lastSig = "";
    let resizeT = null;
    const sitOk = {};

    function clampCount(n) {
      n = Math.round(Number(n));
      if (!Number.isFinite(n) || n < 0) return 0;
      return Math.min(9999, n);
    }
    function normalizeNumbers(raw) {
      const out = {};
      if (!raw || typeof raw !== "object" || Array.isArray(raw)) return out;
      for (const k of Object.keys(raw)) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
        const day = raw[k];
        if (!day || typeof day !== "object" || Array.isArray(day)) continue;
        const sess = {};
        for (const s of Object.keys(day)) {
          if (!/^[1-8]$/.test(s)) continue;
          const v = day[s];
          if (!v || typeof v !== "object" || Array.isArray(v)) continue;
          const rec = {};
          if (Number.isFinite(Number(v.participants))) rec.participants = clampCount(v.participants);
          if (Number.isFinite(Number(v.engagement))) rec.engagement = clampCount(v.engagement);
          if ("participants" in rec || "engagement" in rec) sess[s] = rec;
        }
        if (Object.keys(sess).length) out[k] = sess;
      }
      return out;
    }
    function fmt(n) {
      return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }
    function initials(name) {
      const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return "?";
      if (parts.length === 1) return Array.from(parts[0])[0].toUpperCase();
      const a = Array.from(parts[0])[0], b = Array.from(parts[parts.length - 1])[0];
      return (a + b).toUpperCase();
    }
    function colorFor(name) {
      let h = 0;
      const s = String(name);
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
      return AVATAR_PALETTE[Math.abs(h) % AVATAR_PALETTE.length];
    }
    function todayRiyadh() {
      const q = new URLSearchParams(location.search).get("date");
      if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) return q;
      return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Riyadh", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
    }
    function dayParts(ymd) {
      const dt = new Date(ymd + "T12:00:00Z");
      const mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][dt.getUTCMonth()];
      return { dow: DOW[dt.getUTCDay()], day: String(dt.getUTCDate()), mon: mon };
    }
    function eventDays() {
      const a = window.XR_FIRST_DAY || "2026-11-12";
      const b = window.XR_LAST_DAY || "2026-11-30";
      const out = [];
      let d = a;
      while (d <= b) {
        out.push(d);
        const dt = new Date(d + "T12:00:00Z");
        dt.setUTCDate(dt.getUTCDate() + 1);
        d = dt.toISOString().slice(0, 10);
      }
      return out;
    }
    function dailyTotals() {
      const nums = normalizeNumbers((data || {}).numbers);
      return Object.keys(nums).sort().map(ymd => {
        let participants = 0, engagement = 0;
        Object.keys(nums[ymd]).forEach(s => {
          const rec = nums[ymd][s];
          participants += rec.participants || 0;
          engagement += rec.engagement || 0;
        });
        return { ymd, participants, engagement, total: participants + engagement };
      });
    }
    function totalsByDay() {
      const map = {};
      dailyTotals().forEach(d => { map[d.ymd] = d; });
      return map;
    }
    function roster() {
      const seen = new Set();
      const names = [];
      function add(n) {
        const name = String(n || "").trim();
        if (!name || seen.has(name)) return;
        seen.add(name);
        names.push(name);
      }
      ((data || {}).teams || []).forEach(t => (t.people || []).forEach(add));
      Object.keys(avatars || {}).forEach(add);
      return names;
    }
    function seedRng(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return function () {
        h = Math.imul(h ^ (h >>> 15), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
      };
    }
    function sitUrl(name) {
      return "../assets/sit-" + String(name || "").trim().toLowerCase().replace(/\s+/g, "-") + ".png";
    }

    function paintStars() {
      const root = document.getElementById("stars");
      if (root.dataset.ready === "1") return;
      root.dataset.ready = "1";
      const rng = seedRng("stars:kpi-scene");
      let html = "";
      for (let i = 0; i < 110; i++) {
        const x = (rng() * 100).toFixed(2);
        const y = (rng() * 52).toFixed(2);
        const s = (0.7 + rng() * 2.1).toFixed(2);
        const delay = (rng() * 3.4).toFixed(2);
        const dur = (2.6 + rng() * 2.4).toFixed(2);
        const o = (0.35 + rng() * 0.65).toFixed(2);
        html += '<i style="left:' + x + '%;top:' + y + '%;width:' + s + 'px;height:' + s + 'px;animation-delay:' + delay + 's;animation-duration:' + dur + 's;opacity:' + o + '"></i>';
      }
      root.innerHTML = html;
    }

    function plantTrees() {
      const root = document.getElementById("woods");
      const W = window.innerWidth || 1920;
      const H = window.innerHeight || 1080;
      const sig = W + "x" + H + ":v3";
      if (root.dataset.sig === sig) return;
      root.dataset.sig = sig;
      const rng = seedRng("woods:kpi-scene:v3");
      const rows = [
        { count: 15, foot: 0.515, hMin: 0.15, hMax: 0.22, b0: 0.60, b1: 0.70, z: 1 },
        { count: 10, foot: 0.548, hMin: 0.18, hMax: 0.26, b0: 0.74, b1: 0.85, z: 2 },
        { count: 4,  foot: 0.575, hMin: 0.22, hMax: 0.30, b0: 0.82, b1: 0.90, z: 4, sides: true }
      ];
      let html = "";
      rows.forEach((row, ri) => {
        for (let i = 0; i < row.count; i++) {
          const kind = TREE_SRC[Math.floor(rng() * TREE_SRC.length)];
          const flip = rng() < 0.5;
          let h = (row.hMin + rng() * (row.hMax - row.hMin)) * H;
          let w = h * kind.aspect;
          let x;
          if (row.sides) {
            const left = i < row.count / 2;
            const t = left ? (i / Math.max(row.count / 2, 1)) : ((i - Math.ceil(row.count / 2)) / Math.max(Math.floor(row.count / 2), 1));
            x = left ? (0.01 + t * 0.13) * W + (rng() - 0.5) * 20 : (0.86 + t * 0.13) * W + (rng() - 0.5) * 20;
          } else {
            const t = (i + 0.5 + (rng() - 0.5) * 0.35) / row.count;
            x = t * W;
          }
          const xn = x / W;
          if (!row.sides && (xn < 0.24 || (xn > 0.54 && xn < 0.90))) { h *= 0.68; w = h * kind.aspect; }
          const y = row.foot * H + (rng() - 0.5) * 10;
          const bright = row.b0 + rng() * (row.b1 - row.b0);
          const scaleX = flip ? -1 : 1;
          html += '<img class="tree" src="' + kind.src + '" alt="" style="left:' + x.toFixed(1) + "px;top:" + y.toFixed(1) + "px;height:" + h.toFixed(1) + "px;width:" + w.toFixed(1) + "px;transform:translate(-50%,-100%) scaleX(" + scaleX + ");filter:brightness(" + bright.toFixed(2) + ") drop-shadow(0 0.4vmin 0.8vmin rgba(0,0,0,0.45));z-index:" + (row.z + i) + '">';
        }
      });
      root.innerHTML = html;
    }

    function plantLeaves() {
      const root = document.getElementById("floor");
      const W = window.innerWidth || 1920;
      const H = (window.innerHeight || 1080) * 0.56;
      const sig = W + "x" + Math.round(H);
      if (root.dataset.sig === sig) return;
      root.dataset.sig = sig;
      const rng = seedRng("floor:kpi-scene:v1");
      let html = "";
      for (let i = 0; i < 90; i++) {
        const x = rng() * 100;
        const y = 18 + rng() * 80;
        const rot = (rng() * 360).toFixed(1);
        const s = (0.7 + rng() * 1.6).toFixed(2);
        const c = LEAF_COLORS[Math.floor(rng() * LEAF_COLORS.length)];
        html += '<i class="leaf" style="left:' + x.toFixed(2) + "%;top:" + y.toFixed(2) + "%;background:" + c + ";transform:rotate(" + rot + "deg) scale(" + s + ')"></i>';
      }
      for (let i = 0; i < 36; i++) {
        const x = rng() * 100;
        const y = 8 + rng() * 50;
        const rot = ((rng() - 0.5) * 50).toFixed(1);
        const s = (0.8 + rng() * 1.4).toFixed(2);
        html += '<i class="tuft" style="left:' + x.toFixed(2) + "%;top:" + y.toFixed(2) + "%;transform:rotate(" + rot + "deg) scale(" + s + ')"></i>';
      }
      root.innerHTML = html;
    }

    function renderSkyTotals(days) {
      const el = document.getElementById("skyTotals");
      const p = days.reduce((s, d) => s + d.participants, 0);
      const e = days.reduce((s, d) => s + d.engagement, 0);
      el.innerHTML =
        '<div class="constel p"><div class="n">' + fmt(p) + '</div><div class="lbl"><span class="ar">المشاركون</span><span class="en">Participants</span></div></div>' +
        '<div class="constel e"><div class="n">' + fmt(e) + '</div><div class="lbl"><span class="ar">التفاعل</span><span class="en">Engagement</span></div></div>' +
        '<div class="constel c"><div class="n">' + fmt(p + e) + '</div><div class="lbl"><span class="ar">المجموع الكلي</span><span class="en">Total</span></div></div>';
    }

    function ensurePiles() {
      const api = window.XRPiles3D;
      if (!api) return false;
      if (api.ready()) return true;
      const canvas = document.getElementById("piles3d");
      if (!api.init(canvas)) return false;
      api.start();
      return true;
    }

    function renderPlots() {
      const root = document.getElementById("plots");
      const days = eventDays();
      const byDay = totalsByDay();
      const today = todayRiyadh();
      const W = window.innerWidth || 1920;
      const H = window.innerHeight || 1080;
      const n = days.length;
      const padX = W * 0.03;
      const slot = (W - padX * 2) / Math.max(n, 1);
      const baseY = H * 0.66;
      const slots = days.map((ymd, i) => {
        const rec = byDay[ymd] || { participants: 0, engagement: 0 };
        return { ymd: ymd, index: i, participants: rec.participants || 0, engagement: rec.engagement || 0 };
      });
      let meta = [];
      if (ensurePiles()) meta = window.XRPiles3D.update(slots) || [];
      const by = {};
      meta.forEach(m => { by[m.ymd] = m; });
      let html = "";
      days.forEach((ymd, i) => {
        const rec = byDay[ymd];
        const p = dayParts(ymd);
        const isToday = ymd === today;
        const filled = !!(rec && (rec.participants > 0 || rec.engagement > 0 || rec.total > 0));
        const m = by[ymd];
        const t = n === 1 ? 0.5 : i / (n - 1);
        const recede = Math.abs(t - 0.5) * 2;
        const gx = m ? m.groundX : (padX + slot * (i + 0.5));
        const gy = m ? m.groundY : baseY;
        const z = Math.round((1 - recede) * 20);
        if (filled) {
          const topY = (m && m.heap && m.heap.topY) ? m.heap.topY : Math.min(
            m && m.p ? m.p.topY : gy,
            m && m.e ? m.e.topY : gy
          );
          let stack = '<div class="plot-tot">' + fmt(rec.total) + "</div>";
          if (rec.participants > 0) stack += '<div class="plot-val p">' + fmt(rec.participants) + "</div>";
          if (rec.engagement > 0) stack += '<div class="plot-val e">' + fmt(rec.engagement) + "</div>";
          html += '<div class="plot-stack" data-day="' + ymd + '" style="left:' + gx.toFixed(1) + "px;top:" + topY.toFixed(1) + 'px;z-index:' + (z + 3) + '">' + stack + "</div>";
          html += '<div class="plot ground' + (isToday ? " today" : "") + '" data-day="' + ymd + '" style="left:' + gx.toFixed(1) + "px;top:" + gy.toFixed(1) + 'px;z-index:' + z + '"><div class="shadow"></div><div class="day-lbl">' + p.day + "</div></div>";
        } else {
          html += '<div class="plot empty ground' + (isToday ? " today" : "") + '" data-day="' + ymd + '" style="left:' + gx.toFixed(1) + "px;top:" + gy.toFixed(1) + 'px;z-index:' + z + '"><div class="pad"></div><div class="day-lbl">' + p.day + "</div></div>";
        }
      });
      root.innerHTML = html;
    }

    function makeFallback(name, s) {
      const av = document.createElement("div");
      av.className = "av fallback";
      av.style.width = av.style.height = s.toFixed(2) + "px";
      av.textContent = initials(name);
      const col = colorFor(name);
      av.style.background = col.bg;
      av.style.color = col.fg;
      av.style.fontSize = (s * 0.42).toFixed(2) + "px";
      return av;
    }

    function attachPortrait(cell, name, avW, avH) {
      function applyMotion(el) {
        const cur = cell.querySelector(".av");
        if (cur && el !== cur) {
          el.style.animationDuration = cur.style.animationDuration;
          el.style.animationDelay = cur.style.animationDelay;
        }
      }
      function fallback() {
        const fb = makeFallback(name, Math.min(avW, Math.max(22, avH * 0.5)));
        applyMotion(fb);
        const old = cell.querySelector(".av");
        if (old) old.replaceWith(fb);
        else cell.insertBefore(fb, cell.querySelector(".av-name"));
        cell.classList.remove("sit");
        return fb;
      }
      function useAvatar() {
        cell.classList.remove("sit");
        if (!avatars[name]) return fallback();
        let img = cell.querySelector("img.av");
        if (!img) {
          img = document.createElement("img");
          img.className = "av photo";
          img.alt = name;
          img.draggable = false;
          img.style.width = avW.toFixed(2) + "px";
          img.style.height = avH.toFixed(2) + "px";
          cell.insertBefore(img, cell.querySelector(".av-name"));
        }
        img.onerror = fallback;
        img.src = avatars[name];
        return img;
      }
      const img = document.createElement("img");
      img.className = "av photo";
      img.alt = name;
      img.draggable = false;
      img.style.width = avW.toFixed(2) + "px";
      img.style.height = avH.toFixed(2) + "px";
      img.onload = function () {
        const src = img.getAttribute("src") || img.src || "";
        if (/sit-/i.test(src)) {
          sitOk[name] = true;
          cell.classList.add("sit");
          if (img.naturalWidth && img.naturalHeight) {
            const w = avH * (img.naturalWidth / img.naturalHeight);
            img.style.width = w.toFixed(2) + "px";
            img.style.height = avH.toFixed(2) + "px";
            cell.style.width = Math.max(w, 64).toFixed(2) + "px";
          }
        }
      };
      img.onerror = function () {
        sitOk[name] = false;
        useAvatar();
      };
      cell.appendChild(img);
      if (sitOk[name] === false) useAvatar();
      else {
        if (sitOk[name] === true) cell.classList.add("sit");
        img.src = sitUrl(name);
      }
    }

    function nativeFace(name) {
      const n = String(name || "").trim().toLowerCase();
      if (n === "hamdi" || n === "muneera") return "right";
      if (n === "modi" || n === "mohammed" || n === "sara" || n === "maram") return "left";
      return "front";
    }
    function needFace(ang) {
      const d = ang * 180 / Math.PI;
      if (d < -20) return "right";
      if (d > 20) return "left";
      return "front";
    }
    function seatAngles(names) {
      const preferred = ["Muneera", "Hamdi", "Modi", "Omar", "Shatha", "Joud", "Mohammed", "Sara", "Maram"];
      const used = new Set();
      const order = [];
      preferred.forEach(p => {
        const hit = names.find(n => n.toLowerCase() === p.toLowerCase() && !used.has(n));
        if (hit) { order.push(hit); used.add(hit); }
      });
      names.forEach(n => { if (!used.has(n)) order.push(n); });
      const N = order.length;
      const explicit = {
        muneera: -158, hamdi: -126, modi: -88,
        omar: -46, shatha: 0, joud: 46,
        mohammed: 88, sara: 126, maram: 158
      };
      const a0 = -158 * Math.PI / 180, a1 = 158 * Math.PI / 180;
      return order.map((name, i) => {
        const preset = explicit[String(name).trim().toLowerCase()];
        const ang = preset != null ? preset * Math.PI / 180 : (N <= 1 ? 0 : a0 + (i / (N - 1)) * (a1 - a0));
        const nat = nativeFace(name);
        const need = needFace(ang);
        const flip = (nat === "left" || nat === "right") && need !== "front" && nat !== need;
        return { name: name, ang: ang, flip: flip };
      });
    }

    function renderTeam() {
      const root = document.getElementById("team");
      root.innerHTML = "";
      let namesRoot = document.getElementById("seat-names");
      if (!namesRoot) {
        namesRoot = document.createElement("div");
        namesRoot.id = "seat-names";
        document.body.appendChild(namesRoot);
      }
      namesRoot.innerHTML = "";
      const names = roster();
      const seats = seatAngles(names);
      if (!seats.length) return;
      const W = window.innerWidth || 1920;
      const H = window.innerHeight || 1080;
      const fireBox = document.getElementById("fire").getBoundingClientRect();
      const fireX = fireBox.left + fireBox.width / 2;
      const fireY = fireBox.bottom;
      const rx = Math.min(W * 0.37, 700);
      const ry = Math.min(H * 0.136, 148);
      const yMax = H - 28;
      seats.forEach((seat, i) => {
        const ang = seat.ang;
        const name = seat.name;
        const x = fireX + rx * Math.sin(ang);
        const y = Math.min(yMax, fireY - ry * Math.cos(ang));
        const depth = (1 - Math.cos(ang)) / 2;
        const scale = 0.70 + 0.30 * depth;
        const avH = Math.max(100, Math.min(230, 168 * scale));
        const avW = avH * 0.72;
        const namePx = Math.max(11, Math.min(18, avH * 0.095));
        const z = 20 + Math.round(depth * 55);
        const cell = document.createElement("div");
        cell.className = "member" + (seat.flip ? " flip" : "");
        cell.style.left = x.toFixed(1) + "px";
        cell.style.top = y.toFixed(1) + "px";
        cell.style.width = avW.toFixed(1) + "px";
        cell.style.zIndex = String(z);
        const delay = (-i * 0.37) + "s";
        const dur = (3.6 + (i % 4) * 0.25) + "s";
        attachPortrait(cell, name, avW, avH);
        const av = cell.querySelector(".av");
        if (av) {
          av.style.animationDuration = dur;
          av.style.animationDelay = delay;
        }
        root.appendChild(cell);
        const nm = document.createElement("div");
        nm.className = "av-name";
        nm.textContent = name;
        nm.title = name;
        const nameY = Math.min(y + 2, H - namePx - 8);
        nm.style.left = x.toFixed(1) + "px";
        nm.style.top = nameY.toFixed(1) + "px";
        nm.style.fontSize = namePx.toFixed(1) + "px";
        const deg = Math.abs(ang * 180 / Math.PI);
        let dx = 0;
        if (deg > 65 && deg < 135) dx = ang < 0 ? -42 : 42;
        if (/^modi$/i.test(name)) dx = -54;
        if (/^hamdi$/i.test(name)) dx = 10;
        if (/^mohammed$/i.test(name)) dx = 50;
        nm.style.transform = "translate(calc(-50% + " + dx + "px), 2px)";
        namesRoot.appendChild(nm);
      });
    }

    function startFire() {
      const frames = document.querySelectorAll("#fire .frame");
      if (!frames.length || document.getElementById("fire").dataset.lit === "1") return;
      document.getElementById("fire").dataset.lit = "1";
      let i = 0;
      function tick() {
        frames.forEach((f, k) => f.classList.toggle("on", k === i));
        const nexts = [];
        for (let k = 0; k < frames.length; k++) if (k !== i) nexts.push(k);
        i = nexts[Math.floor(Math.random() * nexts.length)] || 0;
        setTimeout(tick, 120 + Math.random() * 60);
      }
      tick();
    }

    function paint(force) {
      const days = dailyTotals();
      const names = roster();
      const sig = JSON.stringify({
        days: days,
        range: eventDays(),
        teams: ((data || {}).teams || []).map(t => t.people || []),
        av: Object.keys(avatars || {}).map(k => k + ":" + String(avatars[k] || "").length),
        sit: sitOk,
        size: [window.innerWidth, window.innerHeight]
      });
      if (!force && sig === lastSig) return;
      lastSig = sig;
      paintStars();
      plantTrees();
      plantLeaves();
      renderSkyTotals(days);
      renderPlots();
      renderTeam();
      startFire();
    }

    async function load() {
      if (!API) return;
      try {
        const [dRes, aRes] = await Promise.all([
          fetch(API + "/data", { cache: "no-store" }),
          fetch(API + "/avatars", { cache: "no-store" })
        ]);
        if (!dRes.ok) throw new Error(dRes.status);
        data = await dRes.json();
        avatars = (aRes.ok ? await aRes.json() : {}) || {};
        if (typeof avatars !== "object" || Array.isArray(avatars) || !avatars) avatars = {};
      } catch (e) {
        if (!data) {
          data = { teams: [], numbers: {} };
          avatars = {};
          lastSig = "";
          paintStars();
          plantTrees();
          plantLeaves();
          renderSkyTotals([]);
          renderPlots();
          renderTeam();
          return;
        }
      }
      paint(false);
    }

    window.addEventListener("resize", () => {
      clearTimeout(resizeT);
      resizeT = setTimeout(() => paint(true), 120);
    });
    if (document.fonts) {
      document.fonts.load("800 24px Cairo").catch(() => {});
      document.fonts.ready.then(() => paint(true));
    }
    startFire();
    paintStars();
    plantTrees();
    plantLeaves();
    load();
    setInterval(load, 45000);
  })();
  </script>
</body>
