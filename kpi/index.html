<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b0520">
<title>XR Hub · KPI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap">
<style>
  :root {
    --deep: #0b0520;
    --navy: #140832;
    --purple: #2a0f6e;
    --violet: #7a2bbf;
    --pink: #f04a9a;
    --yellow: #EAF04A;
    --lilac: #c4a0ff;
    --cream: #F4EFE6;
    --muted: rgba(255,255,255,0.62);
    --fire: #ff8a2a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--deep);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  body {
    font-family: Cairo, "Noto Sans Arabic", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #fff;
  }
  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 50% 36% at 78% 10%, rgba(255, 230, 180, 0.16), transparent 62%),
      radial-gradient(ellipse 70% 40% at 50% 100%, rgba(240, 74, 154, 0.22), transparent 70%),
      radial-gradient(ellipse 55% 38% at 18% 86%, rgba(122, 43, 191, 0.28), transparent 70%),
      linear-gradient(180deg, #070314 0%, #12062e 38%, #2a0f6e 68%, #5a1a7a 86%, #8a2a6e 100%);
    pointer-events: none;
  }
  #stars {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  #stars i {
    position: absolute;
    display: block;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 6px rgba(255,255,255,0.8);
    animation: twinkle 3.4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }
  .moon {
    position: fixed;
    z-index: 1;
    top: 5.5%;
    right: 9%;
    width: 7.2vmin;
    height: 7.2vmin;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff8e4, #e8d9a8 55%, #cbb87a 100%);
    box-shadow: 0 0 3.5vmin 1.2vmin rgba(255, 230, 170, 0.22), 0 0 8vmin 2vmin rgba(234, 240, 74, 0.08);
    pointer-events: none;
  }
  .moon::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 68% 40%, transparent 42%, rgba(11, 5, 32, 0.18) 80%);
  }
  .buildings {
    position: fixed;
    left: 0;
    right: 0;
    top: 8%;
    height: 38%;
    z-index: 2;
    pointer-events: none;
  }
  .buildings .b {
    position: absolute;
    object-fit: contain;
    object-position: bottom center;
    filter: brightness(0.8) saturate(0.8);
    pointer-events: none;
  }
  .buildings .ithra {
    left: 1%;
    bottom: 0;
    height: 100%;
    width: 44%;
    object-position: left bottom;
    filter: brightness(0.8) saturate(0.8) drop-shadow(0 1.2vmin 2.4vmin rgba(40, 70, 140, 0.35));
  }
  .buildings .iktva {
    right: 1%;
    bottom: 2%;
    height: 58%;
    width: 48%;
    object-position: right bottom;
    filter: brightness(0.8) saturate(0.8) drop-shadow(0 1.2vmin 2.4vmin rgba(40, 70, 140, 0.35));
  }
  .ground {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 55%;
    z-index: 3;
    pointer-events: none;
    background:
      radial-gradient(ellipse 70% 55% at 50% 100%, rgba(255, 120, 40, 0.22), transparent 58%),
      linear-gradient(180deg, transparent 0%, rgba(18, 8, 36, 0.55) 12%, #160a28 38%, #12081e 100%);
  }
  .ground::before {
    content: "";
    position: absolute;
    left: -5%;
    right: -5%;
    top: 8%;
    height: 18%;
    background: radial-gradient(ellipse at center, rgba(28, 12, 48, 0.9), transparent 70%);
  }
  .brand {
    position: fixed;
    z-index: 12;
    top: 2.2%;
    left: 2.4%;
    pointer-events: none;
  }
  .brand .kicker {
    font-weight: 800;
    letter-spacing: 0.18em;
    font-size: 1.25vmin;
    color: var(--yellow);
    text-transform: uppercase;
  }
  .brand h1 {
    display: flex;
    align-items: baseline;
    gap: 0.55em;
    line-height: 1;
  }
  .brand h1 .ar {
    font-size: 3.2vmin;
    font-weight: 800;
    color: #fff;
    direction: rtl;
  }
  .brand h1 .en {
    font-size: 2.2vmin;
    font-weight: 800;
    color: var(--yellow);
    letter-spacing: 0.06em;
  }
  .sky-totals {
    position: fixed;
    z-index: 12;
    top: 3.2%;
    left: 22%;
    right: 22%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 4.5vw;
    pointer-events: none;
  }
  .constel {
    text-align: center;
    text-shadow: 0 0 1.6vmin rgba(255,255,255,0.28), 0 0.3vmin 1.2vmin rgba(10, 0, 40, 0.55);
    min-width: 0;
  }
  .constel .n {
    font-weight: 800;
    font-size: 6.2vmin;
    line-height: 0.92;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
  }
  .constel.p .n { color: var(--lilac); }
  .constel.e .n { color: var(--yellow); }
  .constel.c .n { color: #fff; font-size: 6.8vmin; }
  .constel .lbl {
    margin-top: 0.3vh;
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: 0.5em;
  }
  .constel .lbl .ar {
    font-weight: 800;
    font-size: 1.55vmin;
    direction: rtl;
  }
  .constel .lbl .en {
    font-weight: 700;
    font-size: 1.05vmin;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.88;
  }
  .constel.p .lbl { color: var(--lilac); }
  .constel.e .lbl { color: var(--yellow); }
  .constel.c .lbl { color: #fff; }
  #plots {
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    z-index: 6;
    pointer-events: none;
  }
  .plot {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform-origin: 50% 100%;
    pointer-events: none;
  }
  .plot .floated {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 0.15vh;
  }
  .plot .day-tot {
    font-weight: 800;
    font-size: 1.7vmin;
    line-height: 1;
    color: rgba(255,255,255,0.22);
    font-variant-numeric: tabular-nums;
    margin-bottom: 0.15vh;
  }
  .plot .pair {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 0.35vw;
  }
  .pile {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .pile .val {
    font-weight: 800;
    font-size: 1.25vmin;
    line-height: 1;
    margin-bottom: 0.25vh;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 0.5vmin rgba(28, 10, 77, 0.9);
  }
  .pile.p .val { color: var(--lilac); }
  .pile.e .val { color: var(--yellow); }
  .stack {
    position: relative;
    flex: none;
  }
  .stack img {
    position: absolute;
    left: 0;
    display: block;
    pointer-events: none;
    filter: drop-shadow(0 0.15vmin 0.2vmin rgba(0,0,0,0.4));
  }
  .plot .shadow {
    width: 78%;
    height: 1.1vmin;
    margin-top: -0.15vh;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.5), transparent 70%);
  }
  .plot.empty .pad {
    width: 3.4vmin;
    height: 1.5vmin;
    border: 0.12vmin dashed rgba(234, 240, 74, 0.28);
    border-radius: 50%;
    background: rgba(234, 240, 74, 0.05);
    margin-top: 0.2vh;
  }
  .plot .day-lbl {
    margin-top: 0.25vh;
    font-weight: 700;
    font-size: 1.05vmin;
    letter-spacing: 0.04em;
    color: rgba(255,255,255,0.42);
    line-height: 1;
    text-transform: uppercase;
  }
  .plot.today .day-lbl { color: var(--yellow); font-weight: 800; }
  .camp {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 40%;
    z-index: 8;
    pointer-events: none;
  }
  .fire-glow {
    position: absolute;
    left: 50%;
    bottom: 2%;
    width: 46vmin;
    height: 22vmin;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 80%, rgba(255, 140, 40, 0.55), rgba(255, 80, 20, 0.12) 42%, transparent 70%);
    filter: blur(8px);
    animation: glowpulse 1.8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glowpulse {
    0%, 100% { opacity: 0.75; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.06); }
  }
  #fire {
    position: absolute;
    left: 50%;
    bottom: 7.2%;
    width: 12.8vmin;
    height: auto;
    transform: translateX(-50%);
    z-index: 40;
    pointer-events: none;
  }
  #fire .frame {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 12.8vmin;
    height: auto;
    display: block;
    opacity: 0;
    filter: drop-shadow(0 0 1.4vmin rgba(255, 140, 40, 0.55));
  }
  #fire .frame:first-child { position: relative; }
  #fire .frame.on { opacity: 1; }
  #team {
    position: absolute;
    inset: 0;
  }
  .member {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: translate(-50%, -100%);
    pointer-events: none;
  }
  .member .av {
    flex: none;
    transform-origin: 50% 100%;
    animation: sway 3.2s ease-in-out infinite;
    will-change: transform;
  }
  .member .av.photo {
    object-fit: contain;
    object-position: center bottom;
    background: transparent;
    border: 0;
    box-shadow: none;
  }
  .member .av.fallback {
    border-radius: 50%;
    border: 0.2vmin solid rgba(255,255,255,0.85);
    background: #5a3a9a;
    color: #fff;
    font-weight: 800;
    display: grid;
    place-items: center;
    line-height: 1;
  }
  .av-name {
    width: 100%;
    text-align: center;
    color: var(--yellow);
    font-family: Cairo, "Noto Sans Arabic", "Segoe UI", system-ui, sans-serif;
    font-weight: 700;
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    unicode-bidi: plaintext;
    flex: none;
    text-shadow: 0 0.15vmin 0.5vmin rgba(10,0,30,0.85);
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-3.2deg); }
    50% { transform: rotate(3.2deg); }
  }
  .member.sit .av { animation-duration: 4.4s; }
  @media (max-aspect-ratio: 3/4) {
    .sky-totals { left: 4%; right: 4%; gap: 3vw; top: 8%; }
    .brand { top: 1.4%; }
    .buildings .ithra { width: 70%; height: 70%; }
    .buildings .iktva { width: 70%; height: 40%; }
  }
</style>
</head>
<body>
  <div class="sky"></div>
  <div id="stars"></div>
  <div class="moon" aria-hidden="true"></div>
  <div class="buildings">
    <img class="b ithra" src="../assets/bg-ithra.png" alt="Ithra">
    <img class="b iktva" src="../assets/bg-iktva.png" alt="iktva">
  </div>
  <div class="ground"></div>
  <header class="brand">
    <div class="kicker">XR Hub</div>
    <h1><span class="ar">المؤشرات</span><span class="en">KPI</span></h1>
  </header>
  <section class="sky-totals" id="skyTotals"></section>
  <section id="plots"></section>
  <section class="camp">
    <div class="fire-glow" aria-hidden="true"></div>
    <div id="team"></div>
    <div id="fire">
      <img class="frame on" src="../assets/bonfire.png" alt="">
      <img class="frame" src="../assets/bonfire-flame-2.png" alt="">
      <img class="frame" src="../assets/bonfire-flame-3.png" alt="">
    </div>
  </section>
  <script src="../config.js"></script>
  <script>
  (function () {
    "use strict";
    const API = window.XR_API;
    const U = 25;
    const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const AVATAR_PALETTE = [
      { bg: "#EAF04A", fg: "#2a0f6e" },
      { bg: "#f04a9a", fg: "#fff" },
      { bg: "#5fe0c8", fg: "#0b3b34" },
      { bg: "#ff9f43", fg: "#3a1d00" },
      { bg: "#8ab4ff", fg: "#0b1c40" },
      { bg: "#c58cff", fg: "#1a0833" },
      { bg: "#7bd389", fg: "#0c2e14" },
      { bg: "#ff6b6b", fg: "#3a0a0a" }
    ];
    const SRC_P = "../assets/chibi-headset.png";
    const SRC_EB = "../assets/chibi-block-black.png";
    const SRC_EW = "../assets/chibi-block-white.png";
    const ASPECT_H = 117 / 160;
    const ASPECT_C = ((148 + 149) / 2) / 160;
    const OVERLAP = 0.225;

    let data = null;
    let avatars = {};
    let lastSig = "";
    let resizeT = null;
    const sitOk = {};

    function clampCount(n) {
      n = Math.round(Number(n));
      if (!Number.isFinite(n) || n < 0) return 0;
      return Math.min(9999, n);
    }
    function normalizeNumbers(raw) {
      const out = {};
      if (!raw || typeof raw !== "object" || Array.isArray(raw)) return out;
      for (const k of Object.keys(raw)) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
        const day = raw[k];
        if (!day || typeof day !== "object" || Array.isArray(day)) continue;
        const sess = {};
        for (const s of Object.keys(day)) {
          if (!/^[1-8]$/.test(s)) continue;
          const v = day[s];
          if (!v || typeof v !== "object" || Array.isArray(v)) continue;
          const rec = {};
          if (Number.isFinite(Number(v.participants))) rec.participants = clampCount(v.participants);
          if (Number.isFinite(Number(v.engagement))) rec.engagement = clampCount(v.engagement);
          if ("participants" in rec || "engagement" in rec) sess[s] = rec;
        }
        if (Object.keys(sess).length) out[k] = sess;
      }
      return out;
    }
    function fmt(n) {
      return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }
    function initials(name) {
      const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return "?";
      if (parts.length === 1) return Array.from(parts[0])[0].toUpperCase();
      const a = Array.from(parts[0])[0], b = Array.from(parts[parts.length - 1])[0];
      return (a + b).toUpperCase();
    }
    function colorFor(name) {
      let h = 0;
      const s = String(name);
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
      return AVATAR_PALETTE[Math.abs(h) % AVATAR_PALETTE.length];
    }
    function todayRiyadh() {
      const q = new URLSearchParams(location.search).get("date");
      if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) return q;
      return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Riyadh", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
    }
    function dayParts(ymd) {
      const dt = new Date(ymd + "T12:00:00Z");
      const mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][dt.getUTCMonth()];
      return { dow: DOW[dt.getUTCDay()], day: String(dt.getUTCDate()), mon: mon };
    }
    function eventDays() {
      const a = window.XR_FIRST_DAY || "2026-11-12";
      const b = window.XR_LAST_DAY || "2026-11-30";
      const out = [];
      let d = a;
      while (d <= b) {
        out.push(d);
        const dt = new Date(d + "T12:00:00Z");
        dt.setUTCDate(dt.getUTCDate() + 1);
        d = dt.toISOString().slice(0, 10);
      }
      return out;
    }
    function dailyTotals() {
      const nums = normalizeNumbers((data || {}).numbers);
      return Object.keys(nums).sort().map(ymd => {
        let participants = 0, engagement = 0;
        Object.keys(nums[ymd]).forEach(s => {
          const rec = nums[ymd][s];
          participants += rec.participants || 0;
          engagement += rec.engagement || 0;
        });
        return { ymd, participants, engagement, total: participants + engagement };
      });
    }
    function totalsByDay() {
      const map = {};
      dailyTotals().forEach(d => { map[d.ymd] = d; });
      return map;
    }
    function roster() {
      const seen = new Set();
      const names = [];
      function add(n) {
        const name = String(n || "").trim();
        if (!name || seen.has(name)) return;
        seen.add(name);
        names.push(name);
      }
      ((data || {}).teams || []).forEach(t => (t.people || []).forEach(add));
      Object.keys(avatars || {}).forEach(add);
      return names;
    }
    function seedRng(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return function () {
        h = Math.imul(h ^ (h >>> 15), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
      };
    }
    function iconCount(v) {
      if (!(v > 0)) return 0;
      return Math.max(1, Math.round(v / U));
    }
    function sitUrl(name) {
      return "../assets/sit-" + String(name || "").trim().toLowerCase().replace(/\s+/g, "-") + ".png";
    }

    function paintStars() {
      const root = document.getElementById("stars");
      if (root.dataset.ready === "1") return;
      root.dataset.ready = "1";
      const rng = seedRng("stars:kpi-scene");
      let html = "";
      for (let i = 0; i < 110; i++) {
        const x = (rng() * 100).toFixed(2);
        const y = (rng() * 58).toFixed(2);
        const s = (0.7 + rng() * 2.1).toFixed(2);
        const delay = (rng() * 3.4).toFixed(2);
        const dur = (2.6 + rng() * 2.4).toFixed(2);
        const o = (0.35 + rng() * 0.65).toFixed(2);
        html += '<i style="left:' + x + '%;top:' + y + '%;width:' + s + 'px;height:' + s + 'px;animation-delay:' + delay + 's;animation-duration:' + dur + 's;opacity:' + o + '"></i>';
      }
      root.innerHTML = html;
    }

    function renderSkyTotals(days) {
      const el = document.getElementById("skyTotals");
      const p = days.reduce((s, d) => s + d.participants, 0);
      const e = days.reduce((s, d) => s + d.engagement, 0);
      el.innerHTML =
        '<div class="constel p"><div class="n">' + fmt(p) + '</div><div class="lbl"><span class="ar">المشاركون</span><span class="en">Participants</span></div></div>' +
        '<div class="constel e"><div class="n">' + fmt(e) + '</div><div class="lbl"><span class="ar">التفاعل</span><span class="en">Engagement</span></div></div>' +
        '<div class="constel c"><div class="n">' + fmt(p + e) + '</div><div class="lbl"><span class="ar">المجموع الكلي</span><span class="en">Total</span></div></div>';
    }

    function stackHtml(kind, value, ymd, iconW, iconH, step) {
      const n = iconCount(value);
      const h = n <= 0 ? 0 : (n === 1 ? iconH : iconH + (n - 1) * step);
      const rng = seedRng(kind + ":" + ymd + ":" + String(U));
      let html = '<div class="stack" style="width:' + iconW.toFixed(1) + 'px;height:' + h.toFixed(1) + 'px">';
      for (let i = 0; i < n; i++) {
        const side = (i % 2 === 0 ? -1 : 1) * (rng() < 0.18 ? -1 : 1);
        const dx = side * (2 + rng() * 3);
        const rot = side * (3 + rng() * 1);
        const src = kind === "p" ? SRC_P : (i % 2 === 0 ? SRC_EB : SRC_EW);
        const bottom = i * step;
        html += '<img src="' + src + '" alt="" style="width:' + iconW.toFixed(1) + 'px;height:' + iconH.toFixed(1) + 'px;bottom:' + bottom.toFixed(1) + 'px;left:' + dx.toFixed(1) + 'px;transform:rotate(' + rot.toFixed(2) + 'deg);transform-origin:50% 80%;z-index:' + i + '">';
      }
      html += "</div>";
      return html;
    }

    function renderPlots() {
      const root = document.getElementById("plots");
      const days = eventDays();
      const byDay = totalsByDay();
      const today = todayRiyadh();
      const W = window.innerWidth || 1920;
      const H = window.innerHeight || 1080;
      const n = days.length;
      const padX = W * 0.035;
      const usable = W - padX * 2;
      const slot = usable / Math.max(n, 1);
      const iconH = Math.max(16, Math.min(30, slot * 0.34));
      const iconWp = iconH / ASPECT_H;
      const iconWe = iconH / ASPECT_C;
      const step = iconH * (1 - OVERLAP);
      const baseY = H * 0.618;
      let html = "";
      days.forEach((ymd, i) => {
        const t = n === 1 ? 0.5 : i / (n - 1);
        const recede = Math.abs(t - 0.5) * 2;
        const scale = 1 - 0.14 * recede;
        const x = padX + slot * i + slot / 2;
        const y = baseY - recede * recede * (H * 0.028);
        const rec = byDay[ymd];
        const p = dayParts(ymd);
        const isToday = ymd === today;
        const filled = !!(rec && (rec.participants > 0 || rec.engagement > 0 || rec.total > 0));
        let inner = "";
        if (filled) {
          inner += '<div class="floated">';
          inner += '<div class="day-tot">' + fmt(rec.total) + '</div>';
          inner += '<div class="pair">';
          inner += '<div class="pile p"><div class="val">' + fmt(rec.participants) + '</div>' + stackHtml("p", rec.participants, ymd, iconWp, iconH, step) + "</div>";
          inner += '<div class="pile e"><div class="val">' + fmt(rec.engagement) + '</div>' + stackHtml("e", rec.engagement, ymd, iconWe, iconH, step) + "</div>";
          inner += "</div></div>";
          inner += '<div class="shadow"></div>';
        } else {
          inner += '<div class="pad"></div>';
        }
        inner += '<div class="day-lbl">' + p.day + "</div>";
        html += '<div class="plot' + (isToday ? " today" : "") + (filled ? "" : " empty") + '" style="left:' + x.toFixed(1) + "px;top:" + y.toFixed(1) + "px;width:" + (slot * 0.96).toFixed(1) + "px;transform:translate(-50%,-100%) scale(" + scale.toFixed(3) + ");z-index:" + Math.round((1 - recede) * 20) + '">' + inner + "</div>";
      });
      root.innerHTML = html;
    }

    function makeFallback(name, s) {
      const av = document.createElement("div");
      av.className = "av fallback";
      av.style.width = av.style.height = s.toFixed(2) + "px";
      av.textContent = initials(name);
      const col = colorFor(name);
      av.style.background = col.bg;
      av.style.color = col.fg;
      av.style.fontSize = (s * 0.42).toFixed(2) + "px";
      return av;
    }

    function attachPortrait(cell, name, avW, avH) {
      function applyMotion(el) {
        const cur = cell.querySelector(".av");
        if (cur && el !== cur) {
          el.style.animationDuration = cur.style.animationDuration;
          el.style.animationDelay = cur.style.animationDelay;
        }
      }
      function fallback() {
        const fb = makeFallback(name, Math.min(avW, Math.max(22, avH * 0.5)));
        applyMotion(fb);
        const old = cell.querySelector(".av");
        if (old) old.replaceWith(fb);
        else cell.insertBefore(fb, cell.querySelector(".av-name"));
        cell.classList.remove("sit");
        return fb;
      }
      function useAvatar() {
        cell.classList.remove("sit");
        if (!avatars[name]) return fallback();
        let img = cell.querySelector("img.av");
        if (!img) {
          img = document.createElement("img");
          img.className = "av photo";
          img.alt = name;
          img.draggable = false;
          img.style.width = avW.toFixed(2) + "px";
          img.style.height = avH.toFixed(2) + "px";
          cell.insertBefore(img, cell.querySelector(".av-name"));
        }
        img.onerror = fallback;
        img.src = avatars[name];
        return img;
      }
      const img = document.createElement("img");
      img.className = "av photo";
      img.alt = name;
      img.draggable = false;
      img.style.width = avW.toFixed(2) + "px";
      img.style.height = avH.toFixed(2) + "px";
      img.onload = function () {
        const src = img.getAttribute("src") || img.src || "";
        if (/sit-/i.test(src)) {
          sitOk[name] = true;
          cell.classList.add("sit");
          if (img.naturalWidth && img.naturalHeight) {
            const w = avH * (img.naturalWidth / img.naturalHeight);
            img.style.width = w.toFixed(2) + "px";
            img.style.height = avH.toFixed(2) + "px";
            cell.style.width = Math.max(w, 64).toFixed(2) + "px";
          }
        }
      };
      img.onerror = function () {
        sitOk[name] = false;
        useAvatar();
      };
      cell.appendChild(img);
      if (sitOk[name] === false) useAvatar();
      else {
        if (sitOk[name] === true) cell.classList.add("sit");
        img.src = sitUrl(name);
      }
    }

    function seatAngles(names) {
      // 0° is behind the fire (up the screen). Negative = left of fire, positive = right.
      // Right-facing sitters go on the left so they look toward the flames;
      // left-facing sitters go on the right; front-facing sitters form the back row.
      const planned = [
        { re: /^hamdi$/i, ang: -88 },
        { re: /^muneera$/i, ang: -125 },
        { re: /^omar$/i, ang: -28 },
        { re: /^shatha$/i, ang: 0 },
        { re: /^joud$/i, ang: 28 },
        { re: /^mohammed$/i, ang: 46 },
        { re: /^sara$/i, ang: 90 },
        { re: /^maram$/i, ang: 118 },
        { re: /^modi$/i, ang: 128 }
      ];
      const used = new Set();
      const seats = [];
      names.forEach(name => {
        const hit = planned.find(p => p.re.test(name) && !used.has(p.re));
        if (hit) {
          used.add(hit.re);
          seats.push({ name: name, ang: hit.ang * Math.PI / 180 });
        }
      });
      const leftovers = names.filter(n => !seats.some(s => s.name === n));
      if (leftovers.length) {
        const taken = seats.map(s => s.ang).sort((a, b) => a - b);
        const a0 = -125 * Math.PI / 180, a1 = 128 * Math.PI / 180;
        leftovers.forEach((name, i) => {
          let ang = a0 + ((i + 1) / (leftovers.length + 1)) * (a1 - a0);
          // nudge away from occupied seats
          taken.forEach(t => {
            if (Math.abs(ang - t) < 0.18) ang += (ang >= t ? 0.2 : -0.2);
          });
          seats.push({ name: name, ang: ang });
        });
      }
      seats.sort((a, b) => a.ang - b.ang);
      return seats;
    }

    function renderTeam() {
      const root = document.getElementById("team");
      root.innerHTML = "";
      const names = roster();
      const camp = document.querySelector(".camp").getBoundingClientRect();
      const W = camp.width || window.innerWidth;
      const H = camp.height || window.innerHeight * 0.40;
      const seats = seatAngles(names);
      if (!seats.length) return;
      const fireX = W * 0.5;
      const fireY = H * 0.835;
      const rx = Math.min(W * 0.345, 660);
      const ry = Math.min(H * 0.34, 140);
      const yMax = H - 8;
      seats.forEach((seat, i) => {
        const ang = seat.ang;
        const name = seat.name;
        const x = fireX + rx * Math.sin(ang);
        const y = Math.min(yMax, fireY - ry * Math.cos(ang) * 0.95);
        const scale = 0.80 + 0.26 * (1 - (Math.cos(ang) + 1) / 2);
        const avH = Math.max(88, Math.min(200, 160 * scale));
        const avW = avH * 0.72;
        const namePx = Math.max(10, Math.min(16, avH * 0.09));
        const z = 30 + Math.round((1 - Math.cos(ang)) * 40);
        const cell = document.createElement("div");
        cell.className = "member";
        cell.style.left = x.toFixed(1) + "px";
        cell.style.top = y.toFixed(1) + "px";
        cell.style.width = avW.toFixed(1) + "px";
        cell.style.zIndex = String(z);
        const delay = (-i * 0.37) + "s";
        const dur = (3.6 + (i % 4) * 0.25) + "s";
        attachPortrait(cell, name, avW, avH);
        const av = cell.querySelector(".av");
        if (av) {
          av.style.animationDuration = dur;
          av.style.animationDelay = delay;
        }
        const nm = document.createElement("div");
        nm.className = "av-name";
        nm.textContent = name;
        nm.title = name;
        nm.style.marginTop = "0.25vh";
        nm.style.fontSize = namePx.toFixed(1) + "px";
        cell.appendChild(nm);
        root.appendChild(cell);
      });
    }

    function startFire() {
      const frames = document.querySelectorAll("#fire .frame");
      if (!frames.length || document.getElementById("fire").dataset.lit === "1") return;
      document.getElementById("fire").dataset.lit = "1";
      let i = 0;
      function tick() {
        frames.forEach((f, k) => f.classList.toggle("on", k === i));
        const nexts = [];
        for (let k = 0; k < frames.length; k++) if (k !== i) nexts.push(k);
        i = nexts[Math.floor(Math.random() * nexts.length)] || 0;
        setTimeout(tick, 120 + Math.random() * 60);
      }
      tick();
    }

    function paint(force) {
      const days = dailyTotals();
      const names = roster();
      const sig = JSON.stringify({
        days: days,
        range: eventDays(),
        teams: ((data || {}).teams || []).map(t => t.people || []),
        av: Object.keys(avatars || {}).map(k => k + ":" + String(avatars[k] || "").length),
        sit: sitOk,
        size: [window.innerWidth, window.innerHeight]
      });
      if (!force && sig === lastSig) return;
      lastSig = sig;
      paintStars();
      renderSkyTotals(days);
      renderPlots();
      renderTeam();
      startFire();
    }

    async function load() {
      if (!API) return;
      try {
        const [dRes, aRes] = await Promise.all([
          fetch(API + "/data", { cache: "no-store" }),
          fetch(API + "/avatars", { cache: "no-store" })
        ]);
        if (!dRes.ok) throw new Error(dRes.status);
        data = await dRes.json();
        avatars = (aRes.ok ? await aRes.json() : {}) || {};
        if (typeof avatars !== "object" || Array.isArray(avatars) || !avatars) avatars = {};
      } catch (e) {
        if (!data) {
          data = { teams: [], numbers: {} };
          avatars = {};
          lastSig = "";
          renderSkyTotals([]);
          renderPlots();
          renderTeam();
          return;
        }
      }
      paint(false);
    }

    window.addEventListener("resize", () => {
      clearTimeout(resizeT);
      resizeT = setTimeout(() => paint(true), 120);
    });
    if (document.fonts) {
      document.fonts.load("800 24px Cairo").catch(() => {});
      document.fonts.ready.then(() => paint(true));
    }
    startFire();
    paintStars();
    load();
    setInterval(load, 45000);
  })();
  </script>
</body>
