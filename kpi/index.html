<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#2a0f6e">
<title>XR Hub · KPI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap">
<style>
  :root {
    --deep: #1c0a4d;
    --purple: #2a0f6e;
    --violet: #7a2bbf;
    --pink: #f04a9a;
    --yellow: #EAF04A;
    --lilac: #c4a0ff;
    --cream: #F4EFE6;
    --card: rgba(28, 10, 77, 0.78);
    --line: rgba(234, 240, 74, 0.38);
    --muted: rgba(255,255,255,0.68);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--purple);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  body {
    font-family: Cairo, "Noto Sans Arabic", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #fff;
  }
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: linear-gradient(135deg, #2a0f6e 0%, #7a2bbf 55%, #f04a9a 100%);
    pointer-events: none;
  }
  .bg .blur {
    position: absolute;
    inset: -8%;
    width: 116%;
    height: 116%;
    object-fit: cover;
    filter: blur(36px) saturate(1.08);
    transform: scale(1.05);
    opacity: 0.9;
  }
  .page {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 2.2vh 2.4vw 1.4vh;
    gap: 1.4vh;
  }
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 2vw;
    flex: none;
  }
  .brand {
    font-weight: 800;
    letter-spacing: 0.18em;
    font-size: 1.5vmin;
    color: var(--yellow);
    text-transform: uppercase;
    margin-bottom: 0.2vh;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.7em;
    line-height: 1;
  }
  header h1 .ar {
    font-size: 4.4vmin;
    font-weight: 800;
    color: #fff;
    direction: rtl;
  }
  header h1 .en {
    font-size: 3.2vmin;
    font-weight: 800;
    color: var(--yellow);
    letter-spacing: 0.06em;
  }
  .totals {
    display: grid;
    grid-template-columns: 1fr 1fr 1.2fr 0.65fr;
    gap: 1vw;
    flex: none;
  }
  .totals.with-today {
    grid-template-columns: 0.9fr 0.9fr 1.15fr 1.45fr 0.6fr;
  }
  .stat {
    background: var(--card);
    border: 0.14vmin solid var(--line);
    border-radius: 1.8vmin;
    padding: 1.1vh 1.5vw 1.2vh;
    box-shadow: 0 0.4vmin 1.6vmin rgba(10, 0, 40, 0.35);
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }
  .stat .n {
    font-weight: 800;
    font-size: 4.8vmin;
    line-height: 0.95;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .stat.p .n { color: var(--lilac); }
  .stat.e .n { color: var(--yellow); }
  .stat.c {
    background: rgba(234, 240, 74, 0.16);
    border-color: var(--yellow);
  }
  .stat.c .n { color: #fff; font-size: 5.2vmin; }
  .stat.d .n { color: #fff; font-size: 4.2vmin; }
  .stat.today {
    border-color: var(--yellow);
    background: rgba(234, 240, 74, 0.12);
  }
  .stat.today .today-nums {
    display: flex;
    align-items: baseline;
    gap: 0.9em;
    min-width: 0;
  }
  .stat.today .today-nums .pair { min-width: 0; }
  .stat.today .n { font-size: 3.6vmin; }
  .stat.today .n.p { color: var(--lilac); }
  .stat.today .n.e { color: var(--yellow); }
  .stat.today .n.c { color: #fff; font-size: 4.2vmin; }
  .stat .lbl {
    margin-top: 0.45vh;
    display: flex;
    align-items: baseline;
    gap: 0.55em;
    min-width: 0;
  }
  .stat .lbl .ar {
    font-weight: 800;
    font-size: 1.7vmin;
    direction: rtl;
  }
  .stat.p .lbl .ar, .stat.p .lbl .en { color: var(--lilac); }
  .stat.e .lbl .ar, .stat.e .lbl .en { color: var(--yellow); }
  .stat.c .lbl .ar, .stat.c .lbl .en { color: #fff; }
  .stat.d .lbl .ar, .stat.d .lbl .en { color: var(--muted); }
  .stat.today .lbl .ar { color: var(--yellow); }
  .stat.today .lbl .en { color: var(--yellow); }
  .stat .lbl .en {
    font-weight: 700;
    font-size: 1.15vmin;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.9;
  }
  .chart-card {
    flex: 1 1 auto;
    min-height: 0;
    background: var(--card);
    border: 0.14vmin solid var(--line);
    border-radius: 2vmin;
    box-shadow: 0 0.4vmin 1.6vmin rgba(10, 0, 40, 0.35);
    padding: 1.4vh 1.4vw 1.2vh;
    display: flex;
    flex-direction: column;
  }
  .chart-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1.5vw;
    flex: none;
    margin-bottom: 0.8vh;
  }
  .chart-title .ar {
    font-weight: 800;
    font-size: 2.1vmin;
    direction: rtl;
    color: #fff;
  }
  .chart-title .en {
    font-weight: 700;
    font-size: 1.15vmin;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .legend {
    display: flex;
    align-items: center;
    gap: 0.7em 1.3em;
    flex-wrap: wrap;
    font-weight: 700;
    font-size: 1.35vmin;
    color: var(--cream);
  }
  .legend .item { display: flex; align-items: center; gap: 0.45em; white-space: nowrap; }
  .lico {
    width: 1.85em;
    height: 1.55em;
    object-fit: contain;
    object-position: center bottom;
    flex: none;
    display: block;
    filter: drop-shadow(0 0.15em 0.15em rgba(0,0,0,0.28));
  }
  .lico-pair {
    position: relative;
    width: 2.15em;
    height: 1.7em;
    flex: none;
  }
  .lico-pair .lico {
    position: absolute;
    width: 1.4em;
    height: 1.4em;
  }
  .lico-pair .lico:first-child { left: 0; bottom: 0; transform: rotate(-8deg); }
  .lico-pair .lico:last-child { right: 0; bottom: 0.08em; transform: rotate(10deg); z-index: 1; }
  .legend .scale {
    color: var(--muted);
    font-size: 1.15vmin;
    letter-spacing: 0.02em;
    font-weight: 700;
  }
  #chart {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
  }
  #chart svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .empty {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2vh 2vw;
  }
  .empty .ar {
    font-weight: 800;
    font-size: 3.2vmin;
    direction: rtl;
    color: var(--yellow);
  }
  .empty .en {
    font-weight: 800;
    font-size: 2.2vmin;
    color: #fff;
    margin-top: 0.3vh;
  }
  .empty p {
    margin-top: 1.2vh;
    color: var(--muted);
    font-size: 1.5vmin;
    font-weight: 600;
    max-width: 36em;
  }
  .team-wrap {
    flex: none;
    height: 25.5vh;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .team-title {
    text-align: center;
    flex: none;
    margin-bottom: 0.4vh;
  }
  .team-title .ar {
    font-weight: 800;
    font-size: 2.2vmin;
    direction: rtl;
    color: var(--yellow);
  }
  .team-title .en {
    font-weight: 700;
    font-size: 1.15vmin;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .team-stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .team-stage::before {
    content: "";
    position: absolute;
    left: 6%;
    right: 6%;
    bottom: 0;
    height: 2.2vmin;
    background: radial-gradient(ellipse at center, rgba(234,240,74,0.32), rgba(42,15,110,0) 70%);
    pointer-events: none;
  }
  #team {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-content: flex-end;
    align-items: flex-end;
    overflow: visible;
  }
  .member {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    overflow: visible;
  }
  .av-name {
    width: 100%;
    text-align: center;
    color: var(--yellow);
    font-family: Cairo, "Noto Sans Arabic", "Segoe UI", system-ui, sans-serif;
    font-weight: 700;
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    unicode-bidi: plaintext;
    flex: none;
  }
  .av {
    flex: none;
    box-sizing: border-box;
    animation: rock 2.6s ease-in-out infinite;
    transform-origin: 50% 100%;
    will-change: transform;
  }
  .av.photo {
    object-fit: contain;
    object-position: center bottom;
    background: transparent;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }
  .av.fallback {
    border-radius: 50%;
    border: 0.2vmin solid rgba(255,255,255,0.85);
    background: #5a3a9a;
    color: #fff;
    font-weight: 800;
    display: grid;
    place-items: center;
    line-height: 1;
  }
  @keyframes rock {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(6deg); }
  }
  @media (max-aspect-ratio: 3/4) {
    .totals, .totals.with-today { grid-template-columns: 1fr 1fr; }
    .stat .n { font-size: 5.4vmin; }
    .stat.c .n { font-size: 5.8vmin; }
    .stat.today { grid-column: 1 / -1; }
    .stat.today .n { font-size: 5vmin; }
    .stat.today .n.c { font-size: 5.6vmin; }
    header h1 .ar { font-size: 5vmin; }
    .team-wrap { height: 22vh; }
    .chart-head { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
  <div class="bg">
    <img class="blur" src="../poster.png" alt="" aria-hidden="true">
  </div>
  <div class="page">
    <header>
      <div>
        <div class="brand">XR Hub</div>
        <h1><span class="ar">المؤشرات</span><span class="en">KPI</span></h1>
      </div>
    </header>
    <section class="totals" id="totals"></section>
    <section class="chart-card">
      <div class="chart-head">
        <div class="chart-title">
          <div class="ar">حسب اليوم</div>
          <div class="en">By day</div>
        </div>
        <div class="legend">
          <span class="item"><img class="lico" src="../assets/chibi-headset.png" alt=""><span>المشاركون · Participants</span></span>
          <span class="item"><span class="lico-pair"><img class="lico" src="../assets/chibi-block-black.png" alt=""><img class="lico" src="../assets/chibi-block-white.png" alt=""></span><span>التفاعل · Engagement</span></span>
          <span class="item scale" id="scaleNote" hidden></span>
        </div>
      </div>
      <div id="chart"></div>
    </section>
    <section class="team-wrap">
      <div class="team-title">
        <div class="ar">الفريق</div>
        <div class="en">The team</div>
      </div>
      <div class="team-stage">
        <div id="team"></div>
      </div>
    </section>
  </div>
  <script src="../config.js"></script>
  <script>
  (function () {
    "use strict";
    const API = window.XR_API;
    const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const AVATAR_PALETTE = [
      { bg: "#EAF04A", fg: "#2a0f6e" },
      { bg: "#f04a9a", fg: "#fff" },
      { bg: "#5fe0c8", fg: "#0b3b34" },
      { bg: "#ff9f43", fg: "#3a1d00" },
      { bg: "#8ab4ff", fg: "#0b1c40" },
      { bg: "#c58cff", fg: "#1a0833" },
      { bg: "#7bd389", fg: "#0c2e14" },
      { bg: "#ff6b6b", fg: "#3a0a0a" }
    ];

    let data = null;
    let avatars = {};
    let lastSig = "";
    let resizeT = null;

    function clampCount(n) {
      n = Math.round(Number(n));
      if (!Number.isFinite(n) || n < 0) return 0;
      return Math.min(9999, n);
    }
    function normalizeNumbers(raw) {
      const out = {};
      if (!raw || typeof raw !== "object" || Array.isArray(raw)) return out;
      for (const k of Object.keys(raw)) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
        const day = raw[k];
        if (!day || typeof day !== "object" || Array.isArray(day)) continue;
        const sess = {};
        for (const s of Object.keys(day)) {
          if (!/^[1-8]$/.test(s)) continue;
          const v = day[s];
          if (!v || typeof v !== "object" || Array.isArray(v)) continue;
          const rec = {};
          if (Number.isFinite(Number(v.participants))) rec.participants = clampCount(v.participants);
          if (Number.isFinite(Number(v.engagement))) rec.engagement = clampCount(v.engagement);
          if ("participants" in rec || "engagement" in rec) sess[s] = rec;
        }
        if (Object.keys(sess).length) out[k] = sess;
      }
      return out;
    }
    function fmt(n) {
      return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }
    function initials(name) {
      const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return "?";
      if (parts.length === 1) return Array.from(parts[0])[0].toUpperCase();
      const a = Array.from(parts[0])[0], b = Array.from(parts[parts.length - 1])[0];
      return (a + b).toUpperCase();
    }
    function colorFor(name) {
      let h = 0;
      const s = String(name);
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
      return AVATAR_PALETTE[Math.abs(h) % AVATAR_PALETTE.length];
    }
    function todayRiyadh() {
      const q = new URLSearchParams(location.search).get("date");
      if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) return q;
      return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Riyadh", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
    }
    function dayParts(ymd) {
      const dt = new Date(ymd + "T12:00:00Z");
      const mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][dt.getUTCMonth()];
      return { dow: DOW[dt.getUTCDay()], day: String(dt.getUTCDate()), mon: mon };
    }
    function dailyTotals() {
      const nums = normalizeNumbers((data || {}).numbers);
      return Object.keys(nums).sort().map(ymd => {
        let participants = 0, engagement = 0;
        Object.keys(nums[ymd]).forEach(s => {
          const rec = nums[ymd][s];
          participants += rec.participants || 0;
          engagement += rec.engagement || 0;
        });
        return { ymd, participants, engagement, total: participants + engagement };
      });
    }
    function roster() {
      const seen = new Set();
      const names = [];
      function add(n) {
        const name = String(n || "").trim();
        if (!name || seen.has(name)) return;
        seen.add(name);
        names.push(name);
      }
      ((data || {}).teams || []).forEach(t => (t.people || []).forEach(add));
      Object.keys(avatars || {}).forEach(add);
      return names;
    }
    function niceMax(v) {
      if (v <= 0) return 10;
      const pow = Math.pow(10, Math.floor(Math.log10(v)));
      const n = v / pow;
      const nice = n <= 1 ? 1 : n <= 1.5 ? 1.5 : n <= 2 ? 2 : n <= 3 ? 3 : n <= 5 ? 5 : 10;
      return nice * pow;
    }
    function ticks(maxY) {
      const candidates = [1, 2, 5, 10, 15, 20, 25, 50, 100, 200, 250, 500, 1000];
      function tryRange(minN, maxN) {
        for (let i = 0; i < candidates.length; i++) {
          const s = candidates[i];
          const n = maxY / s;
          if (n >= minN && n <= maxN && Math.abs(n - Math.round(n)) < 1e-9) {
            const out = [];
            for (let v = s; v <= maxY + 1e-9; v += s) out.push(v);
            return out;
          }
        }
        return null;
      }
      return tryRange(3, 4) || tryRange(2, 6) || [maxY];
    }

    function renderTotals(days) {
      const el = document.getElementById("totals");
      const p = days.reduce((s, d) => s + d.participants, 0);
      const e = days.reduce((s, d) => s + d.engagement, 0);
      const today = todayRiyadh();
      const td = days.find(d => d.ymd === today);
      el.classList.toggle("with-today", !!td);
      const parts = dayParts(today);
      const todayCard = td
        ? ('<div class="stat today"><div class="today-nums">' +
           '<div class="pair"><div class="n p">' + fmt(td.participants) + '</div></div>' +
           '<div class="pair"><div class="n e">' + fmt(td.engagement) + '</div></div>' +
           '<div class="pair"><div class="n c">' + fmt(td.total) + '</div></div>' +
           '</div><div class="lbl"><span class="ar">اليوم</span><span class="en">Today · ' + parts.day + ' ' + parts.mon + '</span></div></div>')
        : "";
      el.innerHTML =
        '<div class="stat p"><div class="n">' + fmt(p) + '</div><div class="lbl"><span class="ar">المشاركون</span><span class="en">Participants</span></div></div>' +
        '<div class="stat e"><div class="n">' + fmt(e) + '</div><div class="lbl"><span class="ar">التفاعل</span><span class="en">Engagement</span></div></div>' +
        '<div class="stat c"><div class="n">' + fmt(p + e) + '</div><div class="lbl"><span class="ar">المجموع الكلي</span><span class="en">Total</span></div></div>' +
        todayCard +
        '<div class="stat d"><div class="n">' + fmt(days.length) + '</div><div class="lbl"><span class="ar">الأيام</span><span class="en">Days counted</span></div></div>';
    }

    function seedRng(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return function () {
        h = Math.imul(h ^ (h >>> 15), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
      };
    }
    function pickUnit(maxVal, maxLayers) {
      const raw = maxVal / Math.max(1, maxLayers);
      const nice = [1, 2, 5, 10, 15, 20, 25, 50, 100, 200, 250, 500, 1000];
      for (let i = 0; i < nice.length; i++) if (nice[i] >= raw - 1e-9) return nice[i];
      return Math.ceil(raw);
    }

    function renderChart(days) {
      const el = document.getElementById("chart");
      const scaleNote = document.getElementById("scaleNote");
      function setScale(U) {
        if (!scaleNote) return;
        if (!U || U <= 1) {
          scaleNote.hidden = true;
          scaleNote.textContent = "";
          return;
        }
        scaleNote.hidden = false;
        scaleNote.textContent = "كل أيقونة = " + fmt(U) + " · Each icon = " + fmt(U);
      }
      if (!days.length) {
        setScale(0);
        el.innerHTML = '<div class="empty"><div class="ar">لا توجد أرقام بعد</div><div class="en">No numbers yet</div><p>Count participants and engagement on the Numbers page and they will appear here.</p></div>';
        return;
      }
      const rect = el.getBoundingClientRect();
      const W = Math.max(640, Math.round(rect.width) || 1200);
      const H = Math.max(280, Math.round(rect.height) || 480);
      const padL = 54, padR = 22, padT = 42, padB = 50;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;
      const maxVal = Math.max.apply(null, days.map(d => Math.max(d.participants, d.engagement)).concat([0]));
      const n = days.length;
      const maxGroup = 200;
      const usedW = Math.min(plotW, n * maxGroup);
      const origin = padL + (plotW - usedW) / 2;
      const groupW = usedW / n;
      const pileGap = Math.max(8, Math.min(22, groupW * 0.08));
      const maxPileW = Math.max(36, (groupW - pileGap) * 0.5);
      const ASPECT_H = 117 / 160;
      const ASPECT_C = ((148 + 149) / 2) / 160;
      // Same icon height so both piles share a vertical scale. Headsets are wider.
      const maxIconHByWidth = Math.min(maxPileW / 2.55 * ASPECT_H, maxPileW / 2.25 * ASPECT_C);
      let iconH = Math.max(20, Math.min(72, maxIconHByWidth, plotH * 0.26));
      const overlap = 0.225;
      let step = iconH * (1 - overlap);
      const availH = Math.max(40, plotH);
      const maxLayers = Math.max(1, 1 + (availH - iconH) / step);
      const U = pickUnit(Math.max(1, maxVal), maxLayers);
      const maxY = niceMax(Math.max(maxVal, U));
      // Fit the tallest pile into availH and keep overlap near 20–25%.
      const nMax = Math.max(maxVal / U, 1);
      if (nMax > 1) {
        const target = availH * (maxVal / maxY);
        const fitted = (target - iconH) / (nMax - 1);
        if (fitted > iconH * 0.68 && fitted < iconH * 0.86) step = fitted;
        else if (fitted <= iconH * 0.68) {
          // Need a coarser scale / smaller icons so they nest without overflowing.
          const needH = iconH + (nMax - 1) * (iconH * 0.75);
          if (needH > availH) {
            const scale = availH / needH;
            iconH = Math.max(18, iconH * scale);
            step = iconH * 0.75;
          } else step = iconH * 0.75;
        } else step = iconH * 0.80;
      }
      const iconWp = iconH / ASPECT_H;
      const iconWe = iconH / ASPECT_C;
      const wideOk = Math.min(iconWp, iconWe) >= 22 && maxPileW >= Math.max(iconWp, iconWe) * 1.55;
      const yOf = v => padT + availH * (1 - v / maxY);
      const pileH = function (v) {
        if (v <= 0) return 0;
        const layers = v / U;
        if (layers <= 1) return iconH * layers;
        return iconH + (layers - 1) * step;
      };
      const labelFs = n > 14 ? 11 : n > 9 ? 13 : 15;
      const valFs = n > 14 ? 11 : n > 9 ? 13 : 15;

      setScale(U);

      let grid = "";
      ticks(maxY).forEach(t => {
        const y = yOf(t);
        grid += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y + '" y2="' + y + '" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>';
        grid += '<text x="' + (padL - 10) + '" y="' + (y + 4) + '" text-anchor="end" fill="rgba(255,255,255,0.62)" font-size="12" font-weight="700" font-family="Cairo, system-ui, sans-serif">' + fmt(t) + '</text>';
      });
      const baseY = padT + availH;
      grid += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + baseY + '" y2="' + baseY + '" stroke="rgba(234,240,74,0.35)" stroke-width="1.5"/>';

      const SRC_P = "../assets/chibi-headset.png";
      const SRC_EB = "../assets/chibi-block-black.png";
      const SRC_EW = "../assets/chibi-block-white.png";

      function layoutPile(kind, value, cx, iw, rng) {
        const layersN = value / U;
        const layerCount = Math.ceil(layersN - 1e-9);
        const items = [];
        if (value <= 0 || layerCount <= 0) return items;
        const useWide = wideOk && layersN >= 2;
        // Wide base, only the top one or two layers taper to a single peak.
        const twoWide = useWide ? Math.max(1, layerCount - (layerCount >= 6 ? 2 : 1)) : 0;
        for (let i = 0; i < layerCount; i++) {
          const width = i < twoWide ? 2 : 1;
          const sit = baseY - i * step;
          const isTop = i === layerCount - 1;
          const partial = (isTop && layersN < layerCount) ? Math.max(0.12, layersN - (layerCount - 1)) : 1;
          let dropK = -1;
          if (width === 2) dropK = rng() < 0.5 ? 0 : 1;
          const rowShift = (i % 2 === 0 ? -1 : 1) * iw * (0.06 + rng() * 0.07);
          for (let k = 0; k < width; k++) {
            const amt = 0.10 + rng() * 0.10;
            const rotAmt = 8 + rng() * 4;
            const side = width === 2 ? (k === 0 ? -1 : 1) : ((i % 2 === 0 ? -1 : 1) * (rng() < 0.25 ? -1 : 1));
            const dx = side * amt * iw;
            const rot = side * rotAmt * (rng() < 0.2 ? -0.8 : 1);
            let x;
            if (width === 2) {
              const sep = iw * 0.58;
              x = cx + (k === 0 ? -sep : sep) - iw / 2 + dx * 0.7 + rowShift;
            } else {
              x = cx - iw / 2 + dx + rowShift * 0.5;
            }
            const drop = (k === dropK) ? iconH * (0.06 + rng() * 0.05) : 0;
            const y = sit - iconH + drop;
            items.push({
              x: x,
              y: y,
              w: iw,
              h: iconH,
              rot: rot,
              cx: x + iw / 2,
              cy: y + iconH * 0.62,
              partial: partial,
              layer: i
            });
          }
        }
        return items;
      }

      function pileVisualTop(items, fallbackTop) {
        if (!items.length) return fallbackTop;
        let top = fallbackTop;
        items.forEach(it => {
          const rad = Math.abs(it.rot) * Math.PI / 180;
          const ext = Math.sin(rad) * (it.w / 2) + (1 - Math.cos(rad)) * (it.h / 2);
          const visibleTop = it.y + (1 - it.partial) * it.h;
          top = Math.min(top, visibleTop - ext);
        });
        return top;
      }

      let defs = '<filter id="pileShade" x="-20%" y="-10%" width="140%" height="140%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.1" flood-color="#000" flood-opacity="0.32"/></filter>';
      let behind = "";
      let piles = "";
      let labels = "";

      days.forEach((d, i) => {
        const mid = origin + groupW * i + groupW / 2;
        const half = Math.min(maxPileW, groupW * 0.42) / 2;
        const cxP = mid - pileGap / 2 - half;
        const cxE = mid + pileGap / 2 + half;

        const taller = Math.max(d.participants, d.engagement);
        const wmY = baseY - Math.max(pileH(taller) * 0.28, 22);
        behind += '<text x="' + mid + '" y="' + wmY.toFixed(1) + '" text-anchor="middle" dominant-baseline="middle" fill="rgba(255,255,255,0.13)" font-size="' + Math.max(26, Math.min(groupW * 0.36, availH * 0.34, 88)).toFixed(1) + '" font-weight="800" font-family="Cairo, system-ui, sans-serif" font-variant-numeric="tabular-nums">' + fmt(d.total) + '</text>';

        function drawSeries(kind, value, cx, iw, color) {
          const rng = seedRng(kind + ":" + d.ymd + ":" + String(U));
          const items = layoutPile(kind, value, cx, iw, rng);
          const targetTop = baseY - pileH(value);
          const clipId = "pc-" + kind + i;
          if (items.length) {
            const minX = Math.min.apply(null, items.map(it => it.x)) - 24;
            const maxX = Math.max.apply(null, items.map(it => it.x + it.w)) + 24;
            defs += '<clipPath id="' + clipId + '"><rect x="' + minX.toFixed(1) + '" y="' + targetTop.toFixed(1) + '" width="' + (maxX - minX).toFixed(1) + '" height="' + (baseY - targetTop + iconH).toFixed(1) + '"/></clipPath>';
            piles += '<g clip-path="url(#' + clipId + ')">';
            items.forEach((it, j) => {
              const src = kind === "p" ? SRC_P : (j % 2 === 0 ? SRC_EB : SRC_EW);
              piles += '<image href="' + src + '" x="' + it.x.toFixed(2) + '" y="' + it.y.toFixed(2) + '" width="' + it.w.toFixed(2) + '" height="' + it.h.toFixed(2) + '" preserveAspectRatio="xMidYMid meet" transform="rotate(' + it.rot.toFixed(2) + ' ' + it.cx.toFixed(2) + ' ' + it.cy.toFixed(2) + ')" filter="url(#pileShade)"/>';
            });
            piles += '</g>';
          }
          const visTop = pileVisualTop(items, value > 0 ? targetTop : baseY);
          const ly = Math.max(16, visTop - 8);
          labels += '<text x="' + cx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="middle" fill="' + color + '" font-size="' + valFs + '" font-weight="800" font-family="Cairo, system-ui, sans-serif" stroke="rgba(28,10,77,0.88)" stroke-width="3.2" paint-order="stroke">' + fmt(value) + '</text>';
        }

        drawSeries("p", d.participants, cxP, iconWp, "#c4a0ff");
        drawSeries("e", d.engagement, cxE, iconWe, "#EAF04A");

        const p = dayParts(d.ymd);
        const mon = (p.mon !== "Nov") ? " " + p.mon : "";
        labels += '<text x="' + mid + '" y="' + (H - 26) + '" text-anchor="middle" fill="#EAF04A" font-size="' + labelFs + '" font-weight="800" font-family="Cairo, system-ui, sans-serif">' + p.day + mon + '</text>';
        labels += '<text x="' + mid + '" y="' + (H - 10) + '" text-anchor="middle" fill="rgba(255,255,255,0.68)" font-size="' + Math.max(10, labelFs - 2) + '" font-weight="700" font-family="Cairo, system-ui, sans-serif">' + p.dow + '</text>';
      });

      el.setAttribute("data-scale", String(U));
      el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Participants and engagement by day"><defs>' + defs + '</defs>' + grid + behind + piles + labels + '</svg>';
    }

    function appendMember(parent, name, j, avW, avH, namePx, nameGap) {
      const cell = document.createElement("div");
      cell.className = "member";
      cell.style.width = avW.toFixed(2) + "px";
      const src = avatars[name];
      const av = document.createElement(src ? "img" : "div");
      av.className = "av " + (src ? "photo" : "fallback");
      av.style.animationDuration = (2.2 + (j % 4) * 0.22) + "s";
      av.style.animationDelay = (-j * 0.37) + "s";
      av.title = name;
      if (src) {
        av.style.width = avW.toFixed(2) + "px";
        av.style.height = avH.toFixed(2) + "px";
        av.src = src;
        av.alt = name;
        av.draggable = false;
      } else {
        const s = Math.min(avW, Math.max(22, avH * 0.5));
        av.style.width = av.style.height = s.toFixed(2) + "px";
        av.textContent = initials(name);
        const col = colorFor(name);
        av.style.background = col.bg;
        av.style.color = col.fg;
        av.style.fontSize = (s * 0.42).toFixed(2) + "px";
      }
      const nm = document.createElement("div");
      nm.className = "av-name";
      nm.textContent = name;
      nm.title = name;
      nm.style.marginTop = nameGap.toFixed(2) + "px";
      nm.style.fontSize = namePx.toFixed(2) + "px";
      cell.appendChild(av);
      cell.appendChild(nm);
      parent.appendChild(cell);
    }

    function renderTeam() {
      const root = document.getElementById("team");
      root.innerHTML = "";
      const names = roster();
      const wrap = root.getBoundingClientRect();
      const n = names.length;
      if (!n) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.style.height = "auto";
        empty.innerHTML = '<div class="en">The team will appear here</div>';
        root.appendChild(empty);
        return;
      }
      const availW = Math.max(200, wrap.width);
      const availH = Math.max(80, wrap.height);
      const namePxBase = Math.max(12, Math.min(20, availH * 0.08));
      const nameGap = Math.max(3, availH * 0.02);
      let cols = n;
      let rows = 1;
      let gap = 14;
      let avW = (availW - gap * (n - 1)) / n;
      if (avW < 72 && n > 6) {
        rows = 2;
        cols = Math.ceil(n / 2);
        gap = 12;
        avW = (availW - gap * (cols - 1)) / cols;
      }
      avW = Math.max(48, Math.min(200, avW));
      const rowH = (availH - gap * (rows - 1)) / rows;
      const nameSpace = namePxBase * 1.2 + nameGap + 2;
      let avH = Math.min(avW * 1.85, rowH - nameSpace);
      if (avH < avW * 0.9) {
        avW = Math.max(48, avH / 0.9);
        avH = Math.min(avW * 1.85, rowH - nameSpace);
      }
      avH = Math.max(24, avH);
      root.style.gap = gap + "px";
      names.forEach((name, j) => appendMember(root, name, j, avW, avH, namePxBase, nameGap));
      root.querySelectorAll(".av-name").forEach(nm => {
        let fs = namePxBase;
        const minFs = Math.max(9, namePxBase * 0.8);
        while (fs > minFs + 0.05 && nm.scrollWidth > nm.clientWidth + 0.5) {
          fs = Math.max(minFs, fs - 0.3);
          nm.style.fontSize = fs.toFixed(2) + "px";
        }
      });
    }

    function paint(force) {
      const days = dailyTotals();
      const sig = JSON.stringify({
        days: days,
        teams: ((data || {}).teams || []).map(t => t.people || []),
        av: Object.keys(avatars || {}).map(k => k + ":" + String(avatars[k] || "").length)
      });
      if (!force && sig === lastSig) return;
      lastSig = sig;
      renderTotals(days);
      renderChart(days);
      renderTeam();
    }

    async function load() {
      if (!API) return;
      try {
        const [dRes, aRes] = await Promise.all([
          fetch(API + "/data", { cache: "no-store" }),
          fetch(API + "/avatars", { cache: "no-store" })
        ]);
        if (!dRes.ok) throw new Error(dRes.status);
        data = await dRes.json();
        avatars = (aRes.ok ? await aRes.json() : {}) || {};
        if (typeof avatars !== "object" || Array.isArray(avatars) || !avatars) avatars = {};
      } catch (e) {
        if (!data) {
          data = { teams: [], numbers: {} };
          avatars = {};
          lastSig = "";
          const chart = document.getElementById("chart");
          chart.innerHTML = '<div class="empty"><div class="ar">تعذر التحميل</div><div class="en">Couldn\'t load the numbers</div><p>The page will try again shortly.</p></div>';
          renderTotals([]);
          renderTeam();
          return;
        }
      }
      paint(false);
    }

    window.addEventListener("resize", () => {
      clearTimeout(resizeT);
      resizeT = setTimeout(() => paint(true), 120);
    });
    if (document.fonts) {
      document.fonts.load("800 24px Cairo").catch(() => {});
      document.fonts.ready.then(() => paint(true));
    }
    load();
    setInterval(load, 45000);
  })();
  </script>
</body>
